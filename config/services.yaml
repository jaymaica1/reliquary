# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.version: '%env(default:app_version_default:file:resolve:APP_VERSION_FILE)%'
    app_version_default: '0.0.0-dev'
    env(APP_VERSION_FILE): '%kernel.project_dir%/VERSION'
    image_upload_directory: '%kernel.project_dir%/public/uploads/images'
    env(MONGODB_URL): ''
    env(MONGODB_DB): ''
    ai_base_url_default: 'https://api.openai.com/v1'
    ai_model_default: 'dall-e-3'
    gemini_base_url_default: 'https://generativelanguage.googleapis.com/v1beta'
    gemini_model_default: 'imagen-3.0-generate-001'
    
    # Access Log PII Protection Configuration
    access_log_pii_protection_default: 'partial'
    access_log.field_protection:
        user_id:
            enabled: true
            strategy: 'hash'
            mask_length: 8
        session_id:
            enabled: true
            strategy: 'hash'
            mask_length: 12
        route_params:
            enabled: true
            strategy: 'selective'
            sensitive_patterns: ['id', 'uuid', 'user', 'email']
        metadata:
            enabled: true
            strategy: 'sanitize'
            allowed_fields: ['route', 'method', 'response_code']
            blocked_headers: ['authorization', 'cookie', 'x-auth-token', 'x-api-key']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Twig\AppExtension:
        arguments:
            $appVersion: '%app.version%'

    # Local storage adapter for checking file existence
    local.storage:
        class: League\Flysystem\Filesystem
        arguments:
            - '@local.adapter'

    local.adapter:
        class: League\Flysystem\Local\LocalFilesystemAdapter
        arguments:
            - '%kernel.project_dir%/public/uploads/images'

    # Cached file existence service
    App\Service\CachedFileExistenceService:
        arguments:
            $cache: '@cache.app'

    App\Twig\ImageUrlExtension:
        arguments:
            $cloudfrontDomain: '%env(default::AWS_CLOUDFRONT_DOMAIN)%'
            $s3Prefix: '%env(default:empty_string:AWS_S3_PREFIX)%'
            $localStorage: '@local.storage'
            $cachedFileExistence: '@App\Service\CachedFileExistenceService'

    Intervention\Image\ImageManager:
        factory: ['Intervention\Image\ImageManager', 'imagick']
            
    App\Service\ImageService:
        arguments:
            $defaultStorage: '@default.storage'
            
    App\Service\AiImage\OpenAiProvider:
        arguments:
            $apiKey: '%env(AI_API_KEY)%'
            $baseUrl: '%env(default:ai_base_url_default:AI_BASE_URL)%'
            $model: '%env(default:ai_model_default:AI_MODEL)%'
        tags: ['app.ai_image_provider']

    App\Service\AiImage\GeminiProvider:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'
            $baseUrl: '%env(default:gemini_base_url_default:GEMINI_BASE_URL)%'
            $model: '%env(default:gemini_model_default:GEMINI_MODEL)%'
        tags: ['app.ai_image_provider']

    App\Service\Ai\OpenAiChatProvider:
        arguments:
            $apiKey: '%env(AI_API_KEY)%'
            $baseUrl: '%env(default:ai_base_url_default:AI_BASE_URL)%'
        tags: ['app.ai_chat_provider']

    App\Service\Ai\AiTextService:
        arguments:
            $providers: !tagged_iterator app.ai_chat_provider


    App\Service\TranslationAnalyzerService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            
    App\Command\TranslateSaintsAiCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            
    App\Command\MigrateImagesToS3Command:
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads'

    App\Monolog\LogPIIProcessor:
        tags:
            - { name: monolog.processor }

    # Access Log PII Protection Service Configuration
    App\Service\AccessLogPIIProtection:
        arguments:
            $protectionLevel: '%env(default:access_log_pii_protection_default:ACCESS_LOG_PII_PROTECTION)%'
            $fieldProtection: '%access_log.field_protection%'
            $environment: '%kernel.environment%'

    App\EventSubscriber\RelicWorkflowSubscriber:
        arguments:
            $fromAddress: '%env(MAILER_FROM)%'

    App\Controller\ContactController:
        arguments:
            $adminEmail: 'contact@santasreliquias.com.br'
            $noReplyEmail: 'no-reply@santasreliquias.com.br'
