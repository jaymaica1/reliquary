# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.version: '%env(default:app_version_default:file:resolve:APP_VERSION_FILE)%'
    app_version_default: '0.0.0-dev'
    env(APP_VERSION_FILE): '%kernel.project_dir%/VERSION'
    image_upload_directory: '%kernel.project_dir%/public/uploads/images'
    env(MONGODB_URL): ''
    env(MONGODB_DB): ''
    
    # Access Log PII Protection Configuration
    access_log_pii_protection_default: 'partial'
    access_log.field_protection:
        user_id:
            enabled: true
            strategy: 'hash'
            mask_length: 8
        session_id:
            enabled: true
            strategy: 'hash'
            mask_length: 12
        route_params:
            enabled: true
            strategy: 'selective'
            sensitive_patterns: ['id', 'uuid', 'user', 'email']
        metadata:
            enabled: true
            strategy: 'sanitize'
            allowed_fields: ['route', 'method', 'response_code']
            blocked_headers: ['authorization', 'cookie', 'x-auth-token', 'x-api-key']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Twig\AppExtension:
        arguments:
            $appVersion: '%app.version%'

    Intervention\Image\ImageManager:
        factory: ['Intervention\Image\ImageManager', 'imagick']
            
    App\Service\ImageService:
        arguments:
            $uploadDir: '%image_upload_directory%'
            
    App\Service\TranslationAnalyzerService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            
    App\Command\GenerateThumbnailsCommand:
        arguments:
            $uploadDir: '%image_upload_directory%'
            
    # Access Log PII Protection Service Configuration
    App\Service\AccessLogPIIProtection:
        arguments:
            $protectionLevel: '%env(default:access_log_pii_protection_default:ACCESS_LOG_PII_PROTECTION)%'
            $fieldProtection: '%access_log.field_protection%'
            $environment: '%kernel.environment%'
