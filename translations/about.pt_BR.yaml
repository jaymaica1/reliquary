# This is a translation file for Portuguese Brazil
about:
  title: 'Sobre o Santas Relíquias'
  subtitle: 'Explore o mundo dos artefatos sagrados e da história religiosa'
  what_is_reliquary:
    title: 'O que é o Santas Relíquias?'
    description: 'Santas Relíquias é uma plataforma dedicada a catalogar e explorar relíquias religiosas de todo o mundo. Nossa missão é documentar esses artefatos sagrados e tornar suas informações acessíveis a pesquisadores, estudiosos religiosos e indivíduos interessados.'
  features:
    title: 'Recursos'
    comprehensive_database:
      title: 'Banco de Dados Abrangente'
      description: 'Extensa coleção de relíquias religiosas'
    saint_information:
      title: 'Informações sobre Santos'
      description: 'Detalhes sobre santos e suas relíquias'
    geolocation_search:
      title: 'Busca por Geolocalização'
      description: 'Encontre relíquias próximas à sua localização'
    user_contributions:
      title: 'Contribuições dos Usuários'
      description: 'Expansão de conteúdo impulsionada pela comunidade'
    multilingual_support:
      title: 'Suporte Multilíngue'
      description: 'Acesse o conteúdo em vários idiomas'
  contact:
    title: 'Contato'
    description: 'Para mais informações sobre o projeto Relicário, visite nosso'
    github_repository: 'repositório no GitHub'
  relic_classes:
    title: 'Compreendendo as Classes de Relíquias'
    intro: 'A Igreja distingue as relíquias em classes para descrever com reverência a natureza do objeto sagrado. Esta classificação é uma tradição material e histórica para ajudar os fiéis a compreenderem o que estão venerando. No entanto, Deus não está preso a essas categorias—Ele infunde Sua graça onde Lhe apraz. Uma humilde relíquia de terceira classe pode ser o instrumento de milagres extraordinários, pois é a fé e a intercessão do santo que atraem o favor de Deus, não a matéria em si. Mantemos estas classificações para preservar a integridade histórica e a organização do santuário.'
    first:
      title: 'Relíquias de primeira classe'
      body: 'Restos físicos do santo, como osso, cabelo ou sangue. Na tradição da Igreja recebem o maior cuidado material por serem o corpo do santo ou partes dele.'
    second:
      title: 'Relíquias de segunda classe'
      body: 'Objetos que o santo possuiu ou usou em vida—roupas, livros, terço ou instrumentos do martírio. Não são o corpo, mas estiveram em contato íntimo com a vida e a santidade do santo.'
    third:
      title: 'Relíquias de terceira classe'
      body: 'Objetos tocados a uma relíquia de primeira classe (ou, por vezes, de segunda), por exemplo um tecido encostado ao túmulo. Prolongam a devoção e são abençoados para os fiéis; a classe descreve proveniência e contato, não a medida do favor de Deus.'
  authentication:
    title: 'Processo de Autenticação'
    description: 'A autenticação de uma relíquia em nosso banco de dados segue um processo rigoroso para garantir sua autenticidade e significância histórica.'
    process:
      contact_custodian:
        title: 'Contato com o Custodio'
        description: 'O processo envolve entrar em contato com o custodio da referida relíquia para verificar sua autenticidade.'
      verify_provenance:
        title: 'Verificar Proveniência'
        description: 'Verificamos se há reconhecimento público de sua presença ou existência no local determinado (proveniência).'