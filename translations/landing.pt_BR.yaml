  quote: '“Dele saía uma força que curava a todos.”'
  quote_ref: 'Lucas 6:19'
  body: 'A Igreja nomeia as classes de relíquias para honrar o que tocamos e vemos—osso, veste ou tecido abençoado—, mas a graça não se mede pela matéria. Dos ossos dos mártires ao mais humilde tecido, cada entrada neste catálogo é oferecida como porta de oração e de comunhão com os santos.'
