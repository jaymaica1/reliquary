guidelines:
  title: 'Submission Guidelines'
  ai_disclaimer: 'Disclaimer: This document is a draft generated by AI for informational purposes only. It does not constitute legal advice and should be reviewed by a legal professional.'
  last_updated: 'Last Updated: January 4, 2026'
  back_to_form: 'Back to Submission Form'
  introduction:
    title: '1. Introduction'
    content: 'To maintain the sanctity and accuracy of the Reliquary project, we ask all contributors to follow these guidelines when submitting information about sacred relics.'
  images:
    title: '2. Image Submission'
    content: 'Images are crucial for the documentation of relics. Please ensure your photos meet the following criteria:'
    items:
      quality: 'Clear, well-lit photographs focusing on the relic and its reliquary.'
      privacy: 'Do not include people, faces, or identifying personal backgrounds in your photos.'
      ownership: 'Only submit photos you have the right to share. Avoid capturing copyrighted materials or private documents.'
  pii:
    title: '3. Personally Identifiable Information (PII)'
    content: 'Protecting your privacy and the privacy of others is paramount. When providing descriptions or provenance details:'
    important_note: 'NEVER include full names, phone numbers, private home addresses, or financial information in the public relic descriptions.'
    items:
      avoid: 'Avoid mentioning living individuals by their full name without explicit consent.'
      anonymity: 'Use general terms for locations (e.g., "Private collection in Rome") rather than specific private addresses.'
  legal:
    title: '4. Legal Responsibility'
    content: 'By submitting information, you acknowledge that you are responsible for the content provided and that it complies with our Terms of Use and Privacy Policy. All submissions are reviewed by our team before being made public.'
