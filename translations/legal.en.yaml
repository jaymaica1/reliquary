    title: '1. Introduction'
    content: 'Welcome to Reliquary. We respect your privacy and are committed to protecting your personal data. This privacy policy will inform you as to how we look after your personal data when you visit our website and tell you about your privacy rights and how the law protects you. The Data Controller for this website is the Reliquary Project Team (contact: privacy@reliquary.example.com).'
