    id: 843
  -
    name: 'Tshimangadzo Samuel Benedict Daswa'
    saint_phrase: '"Seu testemunho ajude especialmente as famílias a espalhar a verdade e a caridade de Cristo” (Papa Francisco)'
    id: 844
  -
    name: 'Mártires Espanhóis Irmãs de São José de Gerona'
    saint_phrase: 'Irmã Josefa: "Para onde vai a mãe, eu vou também, não a abandono"'
    id: 845
  -
    name: 'Maria Teresa Casini'
