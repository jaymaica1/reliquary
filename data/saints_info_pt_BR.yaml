    id: 837
  -
    name: 'Louis-Edouard Cestac'
    saint_phrase: '"É isso que sou... tudo de Deus, para Deus e com Deus”'
    id: 838
  -
    name: 'Luigi Caburlotto'
    saint_phrase: '“O amor obriga a tratar todos com suavidade e doçura"'
    id: 839
  -
    name: 'Luigi della Consolata'
