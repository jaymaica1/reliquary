  -
    name: 'Maria Teresa Bonzel'
    saint_phrase: '"Uma consagrada que ao fervor da contemplação dos mistérios divinos uniu o zelo da caridade para com os pobres e os enfermos" (Papa Francisco)'
    id: 821
  -
    name: 'Maria Cristina de Savoia'
    saint_phrase: '"Jesus, ó bom Jesus, glorifique esta sua Serva"'
    id: 822
  -
    name: 'Giuseppe Girotti'
    saint_phrase: '"Um jovem dominicano de figura angelical que com seus grandes olhos negros invocava Jesus-Viático para a Vida eterna" (Edmond Michelet, companheiro de campo de concentração e futuro ministro de Charles De Gaulle na França)'
