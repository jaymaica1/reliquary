    id: 808
  -
    name: 'Odoardo Focherini'
    saint_phrase: '"Declaro que morrerei na mais pura fé católica apostólica romana e na plena submissão à vontade de Deus, oferecendo minha vida em holocausto pela minha Diocese, pela Ação Católica, pelo Papa e pelo retorno da paz no mundo"'
    id: 809
  -
    name: 'Margarida Lúcia Szewczyk'
    saint_phrase: 'Conhecida como a “mãe dos pobres e dos órfãos”'
    id: 810
  -
    name: 'Sofia Tcheca-Maciejowska'
