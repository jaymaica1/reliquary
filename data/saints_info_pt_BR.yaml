    saint_phrase: '"Szilard, meu irmão, eu te consagro bispo para o martírio" (Patrick O''Hara)'
    id: 764
  -
    name: 'Maria Barbara da Santíssima Trindade'
    saint_phrase: '“Façamos do Coração de Maria um cofre para colocar todas as dores, aflições e fadigas, como esmola ao Santo Padre, já que não temos dinheiro para dar”'
    id: 765
  -
    name: 'João Paulo II'
    saint_phrase: 'o Papa da família'
    id: 766
  -
    name: 'Justino Maria Russolillo'
    saint_phrase: '“O que faço em Pianura? Faço padres”'
    id: 767
  -
    name: 'Georg Häfner'
    saint_phrase: '“É determinado pelo Senhor que eu percorra a via crucis. Quinta-feira provavelmente irei a Dachau. Não se preocupem muito com isso, nada acontece sem a vontade de Deus”'
    id: 768
  -
    name: 'Maria Clara de Jesus Menino'
    saint_phrase: '"Olhem, aquelas são meu povo! Que pena sinto por não poder socorrê-los!"'
    id: 769
  -
    name: 'Dulce Lopes Pontes'
    saint_phrase: '“Amar e servir”'
    id: 770
  -
    name: 'Maria Serafina do Sagrado Coração de Jesus'
    saint_phrase: '“Filhas minhas, aprendam a sorrir sempre”'
    id: 771
  -
    name: 'João de Palafox e Mendoza'
    saint_phrase: '”Bispo e vice-rei em público e monge e eremita em segredo”'
    id: 772
  -
    name: 'Alois Andritzki'
    saint_phrase: '“Nunca nos queixaremos. Não abandonaremos nossa compostura. Não esqueceremos nem por um momento nosso sacerdócio”'
    id: 773
  -
    name: 'Marguerite Rutan'
    saint_phrase: '"Morro vítima da perversidade de alguns homens, mas perdoo de coração os autores da minha morte"'
    id: 774
  -
    name: 'Mártires de Lübeck'
    saint_phrase: '"A Cristo, nosso Rei, fidelidade eterna!"'
    id: 775
  -
    name: 'Serafino Morazzone'
    saint_phrase: '"O consagrado deve ter unicamente o Senhor como sua herança"'
    id: 776
  -
    name: 'Clemente Vismara'
    saint_phrase: '"Sou o único cristão em um raio de 100 e mais quilômetros, o padre mais próximo está a seis dias a cavalo. Se quero ver outro batizado, devo me olhar no espelho"'
    id: 777
  -
    name: 'Enrichetta Alfieri'
    saint_phrase: '“A oração e a meditação tornaram-se minha única ocupação; minha força na reclusão”'
    id: 778
  -
    name: 'János Scheffler'
    saint_phrase: '"Nos ensina o caminho para testemunhar, mesmo com sacrifício, nossa fidelidade aos mandamentos de Deus e às Bem-aventuranças evangélicas" (Cardeal Angelo Amato)'
