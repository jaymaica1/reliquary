    id: 818
  -
    name: '522 Mártires Espanhóis'
    saint_phrase: '"Louvamos o Senhor por estes seus corajosos testemunhas, e por sua intercessão suplicamos que libere o mundo de toda violência" (Papa Francisco)'
    id: 819
  -
    name: 'Rolando Rivi'
    saint_phrase: '"Que mal faço ao usá-la? Não tenho vontade de tirá-la. Eu estudo para ser padre e a veste é o sinal de que sou de Jesus"'
