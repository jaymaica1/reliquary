    id: 864
  -
    name: 'Mario Borzaga e Paul Thoj Xyooj'
    saint_phrase: 'Mario: “…não há mais o que temer, ou de se lamentar: Deus me colocou aqui e aqui estou”  Pauli: “Se vocês o matarem, também me matarão. Morto ele, eu também morrerei. Vivo ele, eu também viverei”'
    id: 865
  -
    name: 'Justus Takayama Ukon'
    saint_phrase: '"O Samurai cristão, incansável promotor da evangelização do Japão" (Card. Angelo Amato)'
    id: 866
  -
    name: '115 Mártires Espanhóis de Almería'
    saint_phrase: '"Seu exemplo e sua intercessão sustentem o compromisso da Igreja em edificar a civilização do amor" (Papa Francisco)'
    id: 867
  -
    name: 'Josef Mayr-Nusser'
    saint_phrase: '"Por sua grande estatura moral e espiritual, ele constitui um modelo para os fiéis leigos" (Papa Francisco)'
    id: 868
  -
    name: 'Leopoldina Naudet'
    saint_phrase: '"[ Nosso instituto é ] grande aos olhos de Deus e pequeno mais do que se pode aos olhos dos homens"'
    id: 869
  -
    name: 'Luis Antônio Rosa Ormières'
    saint_phrase: '"Formar verdadeiros discípulos de Cristo"'
    id: 870
  -
    name: 'João Sullivan'
    saint_phrase: 'Pobre entre os pobres'
    id: 871
  -
    name: 'Mártires Espanhóis Missionários do Sagrado Coração de Jesus'
    saint_phrase: '"Vocês nos matam porque somos religiosos. Viva...!". Plausivelmente estava prestes a gritar: «Viva Cristo Rei!»'
    id: 872
  -
    name: 'Teófilo Matulionis'
    saint_phrase: '"Através da Cruz, rumo às estrelas"'
    id: 873
  -
    name: 'Ítala Mela'
    saint_phrase: '“Senhor, eu te seguirei mesmo nas trevas, a custo de morrer"'
    id: 874
  -
    name: 'Tito Zeman'
    saint_phrase: '"Mesmo que eu perdesse a vida, não a consideraria desperdiçada, sabendo que pelo menos um daqueles que ajudei se tornou sacerdote em meu lugar"'
    id: 875
  -
    name: 'Stanley Francis Rother'
    saint_phrase: '"O pastor não pode fugir. Me matem aqui"'
    id: 876
  -
    name: 'Jesús Jaramillo Monsalve'
    saint_phrase: '"Vigiem! O Senhor vem!"'
    id: 877
  -
    name: 'Pedro María Ramírez Ramos'
    saint_phrase: '"Desejo morrer por Cristo e na sua fé. Pai, perdoa-os. Tudo por Cristo"'
    id: 878
  -
    name: 'João Schiavo'
    saint_phrase: '“Pai, eu sempre quis fazer a tua vontade”'
    id: 879
  -
    name: '109 Mártires Espanhóis Clarettianos'
    saint_phrase: '“Não temos medo”'
    id: 880
  -
    name: 'Arsênio da Trigolo'
