    id: 787
  -
    name: 'Hildegard Burjan'
    saint_phrase: '"Precisamos de pessoas que não vão apenas pregar aos outros, é necessário um discurso através dos fatos"'
    id: 788
  -
    name: 'Maria Agnese-Teresa do Santíssimo Sacramento'
    saint_phrase: '“Oportet illum regnare” (“Ele deve reinar”)'
    id: 789
  -
    name: 'Pierre-Adrien Toulorge'
    saint_phrase: '“Sobre ti invoco a bênção divina. Na véspera do meu martírio”'
    id: 790
  -
    name: 'Giuseppe Toniolo'
