    id: 791
  -
    name: 'Maria Luísa de Lamoignon'
    saint_phrase: 'O Bispo lhe escreve: "Deus está te esperando para começar seu trabalho"'
    id: 792
  -
    name: 'Jean Joseph Lataste'
    saint_phrase: '“Quem quer que você seja, venha a Jesus. Ele tem bálsamo para todas as feridas, água para todos os pecados”'
    id: 793
  -
    name: 'Cecília Eusepi'
    saint_phrase: '"Chegarei a Jesus por um pequeno caminho, curto, muito curto, traçado por Teresa, a pequena. Aqui está: Humildade, Abandono, Amor"'
    id: 794
  -
    name: 'Mariano Arciero'
    saint_phrase: '"Chora-se o corpo sem esperança de ressuscitá-lo. Não se chora a alma, que com o choro ressuscita"'
    id: 795
  -
    name: 'Luís Brisson'
    saint_phrase: '"Tenui nec dimittam" (Eu o tenho comigo, nunca o deixarei)'
    id: 796
  -
    name: 'Gabriel Maria Allegra'
    saint_phrase: '“Minha atividade com os irmãos separados deve ser cercada de silêncio, amor e oração. Cresce dia após dia e é uma experiência comovente e extremamente dolorosa”'
    id: 797
  -
    name: 'Frederico Bachstein e 13 companheiros'
    saint_phrase: '"Nos lembram que crer em Cristo significa estar disposto a sofrer com Ele e por Ele" (Benedito XVI)'
    id: 798
  -
    name: 'Maria Luísa Prosperi'
    saint_phrase: '“Eu nada decido, quero apenas o que Deus quer”'
    id: 799
  -
    name: 'Maria Crescência Pérez'
    saint_phrase: '"Modelo de doçura evangélica animada pela fé" (Benedito XVI)'
    id: 800
  -
    name: 'Maria Troncatti'
    saint_phrase: '“Devo ser missionária”'
    id: 801
  -
    name: 'Lázaro Devasahayam Pillai'
    saint_phrase: '"Ele se tornou cristão, independentemente da diferença de casta, abraçando todos como irmãos amados" (card. Angelo Amato)'
    id: 802
  -
    name: 'Nicolau Rusca'
    saint_phrase: '“Odiem o erro, não o errante”'
    id: 803
  -
    name: 'Lucas Passi'
    saint_phrase: '“Quem não arde não acende”'
    id: 804
  -
    name: 'Cristóvão de Santa Catarina'
    saint_phrase: 'Dele diziam: “Eu aprendo muito mais vendo o pai Cristóvão enquanto pede esmola na rua, do que ouvindo muitas pregações”'
    id: 805
  -
    name: 'Pino Puglisi'
    saint_phrase: '"Não tenho medo das palavras dos violentos, mas do silêncio dos honestos"'
    id: 806
  -
    name: 'Luiz Novarese'
    saint_phrase: '"Os doentes devem se sentir os autores do seu próprio apostolado"'
    id: 807
  -
    name: 'Francisca de Paula de Jesus'
