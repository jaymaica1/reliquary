    id: 851
  -
    name: 'Francisco Maria Greco'
    saint_phrase: '"É educando na fé que se educa para a vida"'
    id: 852
  -
    name: 'Maria Celeste Crostarosa'
    saint_phrase: '"As Redentoristas deverão imprimir nelas a vida e a verdadeira semelhança do Redentor, tornando-se na terra retratos animados vivos”'
