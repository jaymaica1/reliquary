  -
    name: 'Elena Aiello'
    saint_phrase: '“Assim como a Cruz foi a medida do amor de Jesus por nós, assim ela é a medida do nosso amor por Ele”'
    id: 780
  -
    name: 'Francisco Paleari'
    saint_phrase: '“Na Pequena Casa há tudo o que é necessário para se tornar santo”'
    id: 781
  -
    name: 'Mártires da Drina'
    saint_phrase: 'Mortas porque eram freiras católicas e por terem recusado as propostas dos chetniks, portanto mártires pela fé e pela pureza'
    id: 782
  -
    name: 'Antônia Maria Verna'
    saint_phrase: '"Trabalhai sempre em vista da Eternidade"'
    id: 783
  -
    name: 'Ana Maria Janer Anglarill'
    saint_phrase: '“Tu, Senhor, me darás a graça de ser uma tua esposa fiel, que te ame muito e te sirva na pessoa dos doentes, dos deficientes”'
