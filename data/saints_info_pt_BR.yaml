    id: 815
  -
    name: 'Maria Bolognesi'
    saint_phrase: 'A “mulher silenciosa da caridade”'
    id: 816
  -
    name: 'Antônio Franco'
    saint_phrase: 'Ministro de Deus e homem de justiça'
    id: 817
  -
    name: 'István Sándor'
