    id: 854
  -
    name: 'Tiago Abbondo'
    saint_phrase: 'A quem lhe pergunta quanto vale o benefício paroquial responde: “pode valer o Paraíso ou o Inferno”'
    id: 855
  -
    name: 'Maria Antônia de São José (Antonia de Paz e Figueroa) chamada Mama Antula'
