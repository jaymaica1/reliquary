    id: 840
  -
    name: 'Flavien Michel Melki'
    saint_phrase: '“É impossível abandonar meus fiéis para salvar a mim mesmo. Isso é contrário à minha fé e ao meu dever de pastor”'
    id: 841
  -
    name: 'Clara Szczęsna'
    saint_phrase: '“Tudo pelo Coração de Jesus”'
    id: 842
  -
    name: 'Pio Alberto Del Corona'
