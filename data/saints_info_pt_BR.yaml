    id: 846
  -
    name: 'Mártires Espanhóis Cistercienses da Estrita Observância (Trapistas) e de São Bernardo'
    saint_phrase: '“Louvemos o Senhor por estes seus corajosos testemunhas e, por sua intercessão, suplicamos a ele que liberte o mundo do flagelo da guerra” (Papa Francisco)'
    id: 847
  -
    name: '26 mártires Capuchinhos de Barcelona'
