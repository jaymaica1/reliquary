    id: 1483
  -
    name: 'Didaco Bessi'
    id: 1484
  -
    name: 'Kunegunda Siwiec'
    saint_phrase: 'Viveu uma fé simples e profunda, dedicando-se completamente a Deus'
    id: 1485
  -
    name: 'José Antônio Maria Ibiapina'
