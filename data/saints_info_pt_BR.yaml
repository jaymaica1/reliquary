    id: 858
  -
    name: 'Władysław Bukowiński'
    saint_phrase: '“Frequentemente os sacerdotes me perguntam: como se pode fazer obra pastoral sem uma igreja? Eu respondo: pode-se”'
    id: 859
  -
    name: 'Mártires Espanhóis Beneditinos'
    saint_phrase: 'Mártires beneditinos'
    id: 860
  -
    name: 'Mártires Espanhóis de Nembra'
    saint_phrase: 'Mártires da Eucaristia'
    id: 861
  -
    name: 'Maria Eugênio de Jesus Menino'
