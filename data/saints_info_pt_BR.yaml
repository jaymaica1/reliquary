    id: 862
  -
    name: 'Mártires Albaneses'
    saint_phrase: '"Agora… posso… compreender… o ''Mehr Licht'' [Mais luz!] de Goethe… esta luz… que o poeta buscava na hora de sua morte… não era certamente a luz… que percebemos com nossos olhos de carne" (V. Prennushi)'
    id: 863
  -
    name: 'Mártires do Laos'
