    id: 882
  -
    name: 'Solanus Casey'
    saint_phrase: '“Tudo vem do Santo Sacrifício de Jesus na Missa”'
    id: 883
  -
    name: 'Mártires Espanhóis Vincencianos'
    saint_phrase: '"Não nos entristeçamos porque nos vemos na prisão. Alegremo-nos pelo bem espiritual que este estado nos traz"'
    id: 884
  -
    name: 'Regina Maria Vattalil'
    saint_phrase: '"Era tão boa. A chamavam de irmã do sorriso" (Papa Francisco)'
    id: 885
  -
    name: 'Teresio Olivelli'
    saint_phrase: '“Ó Jesus, eu te amei na terra sofrendo: te amarei no céu gozando”'
    id: 886
  -
    name: 'Hanna Chrzanowska'
    saint_phrase: '“Graças a você, Hanna, que viveu entre nós, que foi exatamente assim, a encarnação das Bem-aventuranças de Cristo, especialmente aquela que diz: bem-aventurados os misericordiosos!” (card. Wojtyła)'
    id: 887
  -
    name: 'Lucien Botovasoa'
    saint_phrase: '"Do desejo de ser amado pelas pessoas, salva-nos Jesus! Do desejo de ser louvado, livra-nos, Jesus! Do desejo de ser honrado, livra-nos Jesus!”'
    id: 888
  -
    name: 'Leonella Sgorbati (nome de nascimento: Rosa)'
    saint_phrase: '“Não é difícil trabalhar quando se busca querer bem e também o verdadeiro Islã é assim: Deus ama todas as suas criaturas”'
    id: 889
  -
    name: 'Clara Fey'
    saint_phrase: '"Preciso permanecer ligada a Jesus como o ramo à videira, caso contrário minha fé murchará”'
    id: 890
  -
    name: 'János Brenner'
    saint_phrase: '“Tudo contribui para o bem daqueles que amam a Deus”'
    id: 891
  -
    name: 'Maria Felícia de Jesus Sacramentado'
    saint_phrase: '"Estou apaixonada por Sauá, mas ainda mais por Jesus"'
    id: 892
  -
    name: 'Carmen Rendíles Martínez'
    saint_phrase: '"Quero ser santa. Quero dizer como São Paulo: já não sou eu quem vive, mas é Cristo que vive em mim"'
    id: 893
  -
    name: 'Maria da Conceição de Trenquelléon'
    saint_phrase: "\"É preciso seguir o Mestre tanto para o Calvário quanto para o Tabor, e ser capaz de lhe dizer em ambas as situações: 'Meu Deus, tu sabes que te amo' ”"
    id: 894
  -
    name: 'Maria Crucifixa do Divino Amor (Maria Gargani)'
    saint_phrase: '“Receber Jesus em mim é a única experiência pela qual vale a pena viver, a experiência do paraíso na terra!”'
    id: 895
  -
    name: 'Jean-Baptiste Fouque'
    saint_phrase: '"Não sou eu. É o bom Deus que fez e faz tudo. Sinto-me impulsionado pelo bom Deus"'
    id: 896
  -
    name: 'Verônica Antal'
    saint_phrase: '"Eu sou de Jesus e Jesus é meu"'
    id: 897
  -
    name: 'Alfonsa Maria Eppinger'
    saint_phrase: '“Sofra, cale-se e reze, porque Deus quer que você seja uma grande Santa”'
    id: 898
  -
    name: 'Anna Kolesárová'
    saint_phrase: '"Virgem e mártir, assassinada por ter resistido àqueles que queriam violar sua dignidade e castidade. É como a nossa italiana Maria Goretti" (Papa Francisco)'
    id: 899
  -
    name: 'Tiburcio Arnáiz Muñoz'
    saint_phrase: '"Acontece que quanto mais faço exercícios espirituais, mais medo tenho, porque quanto mais vejo a dignidade sacerdotal, mais clara fica a minha indignidade. Mas a cada vez sinto mais forte a minha vocação"'
    id: 900
  -
    name: 'Túlio Maruzzo'
    saint_phrase: 'Não denunciava, anunciava'
    id: 901
  -
    name: 'Luis Obdulio Arroyo Navarro'
    saint_phrase: '"Se devo morrer ao lado dos pais, considero isso uma graça"'
    id: 902
  -
    name: 'Clelia Merloni'
    saint_phrase: '"Levem a todos um raio da ternura do Coração de Jesus"'
    id: 903
  -
    name: 'Teodoro Illera Del Olmo e 15 companheiros'
    saint_phrase: '"Não escondo a cruz, assim saberão que sou cristão, e se me matarem na montanha, não quero morrer como um cão"'
    id: 904
  -
    name: 'Michał Giedrojć'
    saint_phrase: 'Atraía muitos fiéis que, convencidos de sua santidade, se dirigiam a ele em suas necessidades físicas e espirituais'
    id: 905
  -
    name: '19 Mártires da Argélia'
    saint_phrase: '“O martírio é o maior testemunho de amor. Não se trata de correr para a morte, nem de buscar o sofrimento pelo sofrimento... mas é derramando o próprio sangue que se chega a Deus”'
    id: 906
  -
    name: '9 Seminaristas Mártires de Oviedo'
    saint_phrase: '"Esses jovens aspirantes ao sacerdócio amaram tanto o Senhor, que o seguiram pelo caminho da Cruz" (Papa Francisco)'
    id: 907
  -
    name: 'Mariano Mullerat I Soldevila'
    saint_phrase: '"Cuidou das sofrências físicas e morais dos irmãos, testemunhando com a vida e com o martírio a primazia da caridade e do perdão" (Papa Francisco)'
    id: 908
  -
    name: 'Enrico Angelo Angelelli Carletti e 3 sócios'
    saint_phrase: 'Esses mártires da fé foram perseguidos por causa da justiça e da caridade evangélica. Seu exemplo e sua intercessão sustentem em particular aqueles que trabalham por uma sociedade mais justa e solidária (Papa Francisco)'
    id: 909
  -
    name: 'Maria Guadalupe Ortiz'
    saint_phrase: 'A primeira leiga do Opus Dei a subir aos honores dos altares'
    id: 910
  -
    name: 'Maria Concepción (Conchita) Cabrera Arias'
    saint_phrase: '“Este é o ponto focal do seu misticismo: levar Jesus a todos e dar a vida pela salvação das almas e da Igreja” (Card. A. Becciu)'
    id: 911
  -
    name: 'Maria Carmen Lacaba Andía e 13 companheiras'
    saint_phrase: '"Essas monjas de clausura, como as Virgens prudentes, aguardaram com fé heroica a chegada do Esposo divino" (Papa Francisco)'
    id: 912
  -
    name: 'Edvige Carboni'
    saint_phrase: '"Uma simples mulher do povo que na humilde cotidianidade abraçou a Cruz, dando testemunho de fé e de caridade" (Papa Francisco)'
    id: 913
  -
    name: 'Mártires da Igreja greco-católica da Romênia'
    saint_phrase: '“Figuras ilustres de discípulos de Cristo, vítimas de um regime que, hostil a Deus por seu ateísmo, pisoteou também o homem, feito à imagem de Deus" (São João Paulo II)'
    id: 914
  -
    name: 'Richard Henkes'
    saint_phrase: 'Quero acima de tudo me tornar “sacerdote sacrifício”, portador da cruz alheia'
    id: 915
  -
    name: 'Benedetta Bianchi Porro'
    saint_phrase: '"Eu penso que coisa maravilhosa é a vida mesmo em seus aspectos mais terríveis; e a minha alma está cheia de gratidão e de amor a Deus por isso"'
    id: 916
  -
    name: 'Alfredo Cremonesi'
    saint_phrase: '“Nós missionários não somos realmente nada. O nosso é o trabalho mais misterioso e maravilhoso. Ver almas que se convertem: um milagre maior do que qualquer milagre”'
    id: 917
  -
    name: 'Maria Emilia Riquelme y Zayas'
    saint_phrase: '"Não quero ser Santa sozinha"'
    id: 918
  -
    name: 'Vittorio Emilio Moscoso Cárdenas'
    saint_phrase: '“Estamos atribulados, mas não esmagados: perplexos, mas não desesperados; perseguidos, mas não abandonados”'
    id: 919
  -
    name: 'Donizetti Tavares de Lima'
    saint_phrase: '"Maria, a principal responsável pelo meu chamado à vida religiosa, porque só Ela sabe interceder junto ao Senhor”'
    id: 920
  -
    name: 'James Alfred Miller'
    saint_phrase: '"Mi sento profondamente impegnato con questi poveri che soffrono nell’America centrale e continuo a lavorare con fede e speranza e con fiducia nella provvidenza di Dio"'
    id: 921
  -
    name: 'Giovanni Tavelli da Tossignano'
    id: 922
  -
    name: 'Maria Luigia del Santissimo Sacramento'
    saint_phrase: 'Fu chiamata “la monaca santa”'
    id: 923
  -
    name: 'Olinto Marella'
    saint_phrase: 'Amo il Signore, perché ascolta la voce della mia preghiera. Verso di me ha teso l’orecchio nel giorno in cui lo invocavo (Sal 116, 1-2)'
    id: 924
  -
    name: 'Carlo Acutis'
    saint_phrase: '"Offro tutte le sofferenze che dovrò patire, al Signore, per il Papa e per la Chiesa, per non fare il Purgatorio e andare dritto in Paradiso"'
    id: 925
  -
    name: 'Michael McGivney'
    saint_phrase: 'Era un uomo della gente, partecipava ai problemi della gente e tutta la gentilezza della sua anima di prete si confermava fortemente e incessantemente negli sforzi per migliorare la loro condizione'
    id: 926
  -
    name: 'Giovanni Roig y Diggle'
    saint_phrase: '"Ora più che mai dobbiamo lottare per Cristo"'
    id: 927
  -
    name: 'Simeone Cardon e 5 Compagni'
    saint_phrase: 'Durante l’ora di Compieta, mentre i monaci si preparavano al coro, i soldati irruppero nel monastero e, dopo essere stati accolti e rifocillati, cominciarono a seminare terrore e morte'
    id: 928
  -
    name: 'Giuseppe Maria Gran Cirera e 9  Compagni'
    id: 929
  -
    name: 'José Gregorio Hernández Cisneros'
    saint_phrase: '«Mia madre mi ha insegnato la virtù fin dalla culla, mi ha fatto crescere nella conoscenza di Dio e mi ha dato per guida la carità»'
    id: 930
  -
    name: 'Rosário Ângelo Livatino'
    saint_phrase: 'Nelle sue agende personali appare sistematicamente la sigla S.T.D. a significare “Sub tutela Dei”'
    id: 931
  -
    name: 'Francisco Maria da Cruz Jordan'
    saint_phrase: 'Fundador dos Salvadorianos'
    id: 932
  -
    name: 'Maria Colón Gullón Yturriaga e 2 Companhas'
    saint_phrase: 'Antes de morrer gritaram “Viva Cristo Rei”.'
    id: 933
  -
    name: 'Maria Laura Mainetti'
    saint_phrase: 'Foi professora, educadora de muitos jovens e estudantes e ponto de referência espiritual para tantas pessoas'
    id: 934
  -
    name: 'Mamerto Esquiù'
    id: 935
  -
    name: 'Stefan Wyszyński'
    saint_phrase: '“O pecado mais grave para um apóstolo é o medo; o medo de um apóstolo é a primeira aliada de seus inimigos”'
    id: 936
  -
    name: 'Elisabetta Czacka'
    saint_phrase: '"Deus sabe do que e de quanto precisamos e o dará quando fizermos o que nos cabe. Ele quer apenas nosso empenho e nossa confiança, e então agirá Ele mesmo"'
    id: 937
  -
    name: 'Giovanni Fornasini'
    saint_phrase: '«Nós somos os seguidores de Aquele que o mundo cego chamou de o maior iludido da história: Jesus»'
    id: 938
  -
    name: 'Gaetana (v.d. Nuccia) Tolomeo'
    saint_phrase: 'Agradeço ao Amor por me ter crucificada por amor'
    id: 939
  -
    name: 'Maria Antonia Samà'
    saint_phrase: 'Na dor, física e espiritual, o Pai celeste, com sua maneira de ensinar e graças aos dons do Espírito Santo, a conduziu à plena conformação com Jesus Crucificado'
    id: 940
  -
    name: 'Francisco Mottola'
    saint_phrase: 'Sou eu que vos gerei em Cristo Jesus, mediante o evangelho (I Cor 4,15)'
    id: 941
  -
    name: 'João Elías Medina e 126 Companheiros'
    id: 942
  -
    name: 'Lúcia da Imaculada'
    saint_phrase: 'Era a irmã que "acolhia, servia, ajudava, transformava as amarguras em sorrisos e os problemas em ocasiões de empenho recíproco e generoso"'
    id: 943
  -
    name: 'Sandra Sabattini'
    saint_phrase: '"Quando amei de verdade, senti que Deus preenchia tudo e todos"'
    id: 944
  -
    name: 'Francisco Cástor Sojo López e 3 Companheiros'
    saint_phrase: '"Então, a todos, dizia: «Se alguém quiser vir após mim, negue-se a si mesmo, tome a sua cruz cada dia e me siga". (cf. Lc 9,23)'
    id: 945
  -
    name: 'Maria Lorenza Requenses in Longo'
    saint_phrase: 'Sua fé se manifestou em seu ardor missionário, no grande afeto e respeito à Igreja e ao Papa, em seu amor pela Eucaristia e pelos sacerdotes e em sua devoção à Paixão de Jesus'
    id: 946
  -
    name: 'Benedito de Santa Coloma De Gramenet e 2 Companheiros'
    saint_phrase: 'Bem-aventurados sois, se sois insultados por causa do nome de Cristo, porque o Espírito de Deus repousa sobre vós; […] se alguém sofre como cristão, não se envergonhe; glorifique a Deus por este nome (1 Pd 4, 14.16)'
    id: 947
  -
    name: 'João Francisco Macha'
    saint_phrase: 'Senhor, meu Deus, em ti encontrei refúgio: salva-me de quem me persegue e liberta-me (Sal 7, 2)'
    id: 948
  -
    name: 'Rutilio Grande García e 2 Companheiros'
    saint_phrase: '“Na motivação do amor não pode faltar a justiça, não pode haver verdadeira paz e verdadeiro amor sobre as bases da injustiça, da violência, das intrigas”'
    id: 949
  -
    name: 'Cosma Spessotto (no século: Sante)'
    saint_phrase: '“Morrer mártir seria uma graça que não mereço. Lavar todos os meus pecados, defeitos e fraquezas com o sangue derramado por Cristo, seria para mim um dom gratuito do Senhor. Desde já eu perdoo e rezo pela conversão dos autores da minha morte”'
    id: 950
  -
    name: 'Cayetano Giménez Martín e 15 Companheiros'
    saint_phrase: 'Piedade de nós, Senhor, em Ti esperamos: seja nosso braço toda manhã, nossa salvação no tempo da angústia (Is 33, 2)'
    id: 951
  -
    name: 'Armida Barelli'
    saint_phrase: '"Com meu Senhor no coração, eu vou ao encontro de todo o mundo e estou certa de que com Ele sempre vencerei. Não me angustio por nada: Ele cuidará de cada dificuldade"'
    id: 952
  -
    name: 'Mario Ciceri'
    saint_phrase: 'Ó Jesus, Tu me seguras suavemente pela mão e através de ensinamentos nunca antes conhecidos, me mostras a Tua bondade, o Teu amor, a Tua misericórdia'
    id: 953
  -
    name: 'Maria Agostina Rivas López, chamada Aguchita'
    saint_phrase: 'A acusação feita contra ela era de ser uma operadora de paz que, com as obras de caridade e a atividade educativa, havia desviado os jovens da insurreição armada'
    id: 954
  -
    name: 'Paolina Maria Jaricot'
    id: 955
  -
    name: 'Luigi Lenzini'
    saint_phrase: 'Entendendo as intenções dos perseguidores, tocou os sinos para pedir ajuda, mas os paroquianos, por medo, não intervieram. Foi levado a uma vinha isolada onde foi barbaramente torturado e assassinado'
    id: 956
  -
    name: 'Leonardo Melki e Tommaso Saleh'
    saint_phrase: 'A eliminação dos dois Beatos, assim como os massacres de outros cristãos realizados simultaneamente naquela região, ficou em silêncio por muito tempo, mas a fama do seu martírio chegou até hoje'
    id: 957
  -
    name: 'Paschalina Jahn e 9 Companheiras'
    saint_phrase: 'Desde o início, a fama de martírio se espalhou e seus túmulos ainda hoje são meta de peregrinações'
    id: 958
  -
    name: 'Angelo Marina Álvarez e 19 Companheiros'
    saint_phrase: 'Eles aceitaram o martírio e viveram aqueles momentos com confiança na Providência, perseverando até o fim'
    id: 959
  -
    name: 'Giovanni Aguilar Donis e 5 companheiros'
    saint_phrase: 'Corramos com perseverança na corrida que temos à frente, mantendo o olhar fixo em Jesus, aquele que dá origem à fé e a leva à consumação (Ebr 12, 1-2)'
    id: 960
  -
    name: 'Isabel Sánchez Romero'
    saint_phrase: 'Suas últimas palavras foram: “Viva Cristo Rei!”'
    id: 961
  -
    name: 'Pedro Ortiz de Zárate e Giovanni Antonio Solinas'
    saint_phrase: '“Não devo desistir, para conseguir com todas as forças a vida eterna das suas almas, mesmo que perca a do corpo”'
    id: 962
  -
    name: 'Giovanni Filippo Jeningen'
    saint_phrase: 'Pelo estilo da sua pregação, alcançou pessoas de todas as classes sociais'
    id: 963
  -
    name: 'Giovanni Paolo I (Albino Luciani)'
    saint_phrase: '"Queremos conservar intacta a grande disciplina da Igreja, na vida dos sacerdotes e dos fiéis, como a comprovada riqueza da sua história assegurou ao longo dos séculos com exemplos de santidade e de heroísmo, tanto no exercício das virtudes evangélicas quanto no serviço aos pobres, aos humildes, aos indefesos"'
    id: 964
  -
    name: 'Maria Costanza Panas (nome secular: Agnese Pacifica)'
    saint_phrase: 'Embora fizesse o que todas faziam, suas ações eram diferentes, mesmo que ninguém soubesse explicar como e por quê'
    id: 965
  -
    name: 'Giuseppe Bernardi e Mario Ghibaudo'
    saint_phrase: '“Tornar-se Sacerdote, viver como Sacerdote, morrer como Sacerdote: essa é a síntese das esperanças mais queridas que concebo para a minha vida”'
    id: 966
  -
    name: 'Mártires redentoristas de Madrid'
    saint_phrase: 'Sabendo que seriam mortos, na prisão se prepararam espiritualmente. Oraram, confessaram-se mutuamente, animaram os outros; alguns continuaram a celebrar a santa Missa. Todos aceitaram a morte com fé'
    id: 967
  -
    name: 'Benigna Cardoso da Silva (v.d. Menina Benigna)'
    saint_phrase: 'Como poderá um jovem manter pura a sua via? Observando a tua palavra (Sal 119, 9)'
    id: 968
  -
    name: 'Maria Berenice Duque Hencker'
    saint_phrase: '"Estar presente onde há uma necessidade eclesial. As dificuldades, a pobreza, a falta de preparação são superadas por uma profunda confiança e no abandono total na Providência"'
    id: 969
  -
    name: 'Maria Carola Cecchin'
    saint_phrase: 'Sua existência foi um contínuo ato de fé. Paciente e benigna, deu a todos sem esperar nada em troca'
    id: 970
  -
    name: 'Giuseppe Ambrosoli'
    saint_phrase: '"As pessoas devem sentir a influência de Jesus que trago comigo; devem sentir que em mim há uma vida sobrenatural expansiva e radiante por sua natureza"'
    id: 971
  -
    name: 'Isabel Cristina Mrad Campos'
    saint_phrase: '«Não tenham medo daqueles que matam o corpo, mas não têm poder de matar a alma» (Mt 10, 28)'
    id: 972
  -
    name: 'Henri Planchat, Ladislas Radigue e 3 Companheiros'
    saint_phrase: 'Durante a prisão, rezaram e confessaram os outros prisioneiros'
    id: 973
  -
    name: 'Maria da Conceição Barrecheguren e García'
    saint_phrase: '«Meu amor será um Deus crucificado, minha comida a oração, minha fortaleza a Eucaristia…»'
    id: 974
  -
    name: 'Jacinto Vera'
    saint_phrase: 'Por sua solicitude para com os mais necessitados, foi chamado de Pai dos pobres'
    id: 975
  -
    name: 'Elisa Martinez'
    saint_phrase: '“Nossa vocação religiosa nos faz parecer com Cristo Redentor não apenas como cristãs, mas de forma mais íntima, mais perfeita, porque fomos chamadas a participar de sua obra de redenção”'
    id: 976
  -
    name: 'Józef e Wiktoria Ulma e seus sete filhos'
    saint_phrase: 'A escolha de ajudar os judeus foi ponderada à luz do mandamento do amor e do exemplo do bom samaritano, como se pode ver nas anotações feitas em sua Bíblia'
    id: 977
  -
    name: 'Giuseppe Beotti'
    saint_phrase: '"Fraternitas amor in domo mea semper"'
    id: 978
  -
    name: 'Manuel González-Serna Rodríguez e 19 Companheiros'
    saint_phrase: 'Durante a prisão, rezavam, se encorajavam mutuamente, se confessavam e expressavam palavras de perdão para os carrascos'
    id: 979
  -
    name: 'Eduardo Francisco Pironio'
    saint_phrase: 'A esperança e a alegria foram seus traços característicos, ligados à sua espiritualidade mariana, própria do Magnificat'
    id: 980
  -
    name: 'Guido de Montpellier'
    saint_phrase: '«O sofredor é o Senhor, médicos e enfermeiros são seus servos»'
    id: 981
  -
    name: 'José Rossi'
    saint_phrase: 'Embora ciente do perigo que corria, buscou se doar com a máxima caridade, ouvindo a todos e tentando socorrer quem estivesse em situação de dificuldade'
    id: 982
  -
    name: 'Michaeł Rapacz'
    saint_phrase: 'Estava ciente do risco que corria e estava disposto a enfrentá-lo serenamente, pronto a dar a vida para permanecer fiel a Cristo e à Igreja'
    id: 983
  -
    name: 'Estêvão Douayhy'
    saint_phrase: 'As conturbadas vicissitudes do Império Otomano, com a alternância de momentos de recrudescência violenta e outros de tolerância aceitável, influenciaram-no, mas não de forma paralisante: foram, ao contrário, um estímulo para um compromisso visando à reconciliação e à pacificação'
    id: 984
  -
    name: 'Carrara, Didonè, Faccin, Joubert'
    saint_phrase: 'O martírio foi para todos os quatro o coroamento de uma vida gasta inteiramente pelo Senhor e pelo próximo'
    id: 985
  -
    name: 'Ján Havlík'
    saint_phrase: 'Reduzido ao extremo das forças, viveu os últimos três anos com edificante serenidade e total entrega à vontade de Deus'
    id: 986
  -
    name: 'Moisés Lira Serafín'
    saint_phrase: '«A santidade é fácil e simples: primeiro a união e, segundo, um sim amoroso e constante a tudo»'
    id: 987
  -
    name: 'Ana de Jesus (nome secular: Ana de Lobera)'
    saint_phrase: 'Em um tempo marcado por escândalos dolorosos, dentro e fora da comunidade cristã, ela e suas companheiras, com sua vida simples e pobre, feita de oração, trabalho e caridade, souberam trazer de volta à fé muitas pessoas'
    id: 988
  -
    name: 'José Torres Padilla'
    saint_phrase: 'Animado pela esperança, se doou ao próximo, atraído especialmente pelas almas mais necessitadas. Os enfermos e suas famílias tiveram um lugar especial em seu coração'
    id: 989
  -
    name: 'Luigj Paliq'
    saint_phrase: 'Os católicos do Kosovo já o consideravam em vida uma figura exemplar de sacerdote e sua fama de martírio se espalhou rapidamente após sua morte'
    id: 990
  -
    name: 'Gjon Gazulli'
    saint_phrase: 'Apesar de ter recebido ameaças, não quis renegar sua fé, mas, tanto durante o processo quanto em seu leito de morte, proclamou a fidelidade a Cristo e à Igreja católica'
    id: 991
  -
    name: 'Max Josef Metzger'
    saint_phrase: 'Durante o processo, defendeu-se mantendo a confiança no Senhor, mesmo diante da aproximação da execução'
    id: 992
  -
    name: 'Gaietà Clausellas Ballvé e Antoni Tort Reixachs'
    id: 993
  -
    name: 'Juana de la Cruz'
    saint_phrase: 'O culto a Juana de la Cruz, comumente conhecida como Santa Juana, começou imediatamente após sua morte, incrementado pela constatação de que seu corpo se manteve incorrupto após anos'
    id: 994
  -
    name: 'Giovanni Merlini'
    saint_phrase: 'Dedicou-se intensamente ao trabalho missionário e à direção espiritual de muitas almas'
    id: 995
  -
    name: 'Camille Costa de Beauregard'
    saint_phrase: '"Humilde, pobre, desapegado dos bens e das honras terrenas, viveu apenas o compromisso heroico da caridade para com os órfãos"'
    id: 996
  -
    name: 'Stanisław Streich'
    saint_phrase: 'Foi um pastor zeloso que implementou um conjunto de iniciativas de caráter pastoral e apostólico, especialmente em favor dos pobres e do mundo operário'
    id: 997
  -
    name: 'Christophora Klomfass e 14 companheiras'
    saint_phrase: '"Permaneceram fiéis à sua vocação aceitando o risco, a fim de permanecer ao lado dos doentes, das crianças e dos órfãos. Permaneceram em seu lugar dedicando-se ao bem do próximo"'
    id: 998
  -
    name: 'Floribert Bwana Chui Bin Kositi'
    saint_phrase: '«Falava frequentemente sobre os meninos de rua. Dizia que não foram eles que escolheram essa vida, que foram forçados a vivê-la devido a determinadas circunstâncias»'
    id: 999
  -
    name: 'Mária Magdolna Bódi'
    saint_phrase: 'Sua vida foi inteiramente marcada pelo espírito de fé, que determinou sua prática sacramental e o ardor apostólico'
    id: 1000
  -
    name: 'Carmelo De Palma'
    saint_phrase: 'Ninguém se afastava dele sem se sentir iluminado e encorajado no caminho da fé'
    id: 1001
  -
    name: 'Giacinto Odrovaz'
    id: 1002
  -
    name: 'Raimundo de Peñafort'
    saint_phrase: 'A morte o alcançou aos 100 anos, e diz-se que durante suas exéquias ocorreram muitos milagres'
    id: 1003
  -
    name: 'Francisca Romana'
    saint_phrase: 'A Santa de Roma'
    id: 1004
  -
    name: 'Carlos Borromeu'
    saint_phrase: '“As almas se conquistam de joelhos”'
    id: 1005
  -
    name: 'Agnese de Montepulciano'
    saint_phrase: '“Meu amado me pertence, eu não o abandonarei mais!”'
    id: 1006
  -
    name: 'Nicola Tavelić, Estêvão de Cuneo, Deodato de Ruticinio, Pedro de Narbona'
    saint_phrase: 'Mártires voluntários'
    id: 1007
  -
    name: '40 mártires da Inglaterra e País de Gales'
    saint_phrase: '"Morro por Deus em razão da minha religião e me considero tão feliz que se algum dia pudesse ter muitas outras vidas, estaria disposto a sacrificá-las todas por uma causa tão nobre" (Philip Evans)'
    id: 1008
  -
    name: 'André Kim Taegon e 102 Sócios'
    saint_phrase: 'Estes são os seus pais e suas mães na fé (João Paulo II)'
    id: 1009
  -
    name: 'Mártires do Vietnã'
    saint_phrase: '"Quem morre pela fé sobe ao céu"'
    id: 1010
  -
    name: 'Meinhard (São Meinardo)'
    saint_phrase: '"O cristianismo foi trazido aqui pelo ardor missionário e pelo zelo pastoral do grande evangelizador São Meinardo, primeiro Bispo da Letônia" (João Paulo II)'
    id: 1011
  -
    name: 'João da Dukla'
    saint_phrase: '"Acima de tudo, ele desejava servir" (João Paulo II)'
    id: 1012
  -
    name: 'Cunegonda (Kinga)'
    saint_phrase: 'O povo a chamava: «consoladora», «médica», «nutridora», «santa mãe»'
    id: 1013
  -
    name: 'Agostinho Zhao Rong e 119 Companheiros'
    saint_phrase: '"Cada pedaço da minha carne, cada gota do meu sangue repetirão que eu sou cristão"'
    id: 1014
  -
    name: 'Hildegarda de Bingen'
    saint_phrase: '"Luz do seu povo e do seu tempo" (João Paulo II)'
    id: 1015
  -
    name: 'Margarida de Città di Castello'
    saint_phrase: 'Como outras místicas medievais, à assídua oração, a Beata unia penitências duríssimas: jejum, vigílias, cilício, flagelação'
    id: 1016
  -
    name: 'Isabel De Rosis'
    saint_phrase: '"Isabel, que a tua vida neste canto tão remoto do mundo seja serena: pois tal é a vontade do Senhor"'
    id: 1017
  -
    name: 'Fulton João Sheen'
    saint_phrase: 'O exercício das virtudes brotava espontaneamente em sua vida e constituía motivo de edificação para tantas pessoas que o encontravam'
    id: 1018
  -
    name: 'José Girelli'
    saint_phrase: '«Quanto mais fraco o homem, humilde e sincero, mais nele se manifesta a presença de Deus, e menos obstáculos encontrará sua palavra»'
    id: 1019
  -
    name: 'Zacarías de Santa Teresa (no século: Zacarías Salteráin Vizcarra)'
    saint_phrase: 'Seu zelo brotava do amor ardente por Deus e da profunda vida contemplativa. Foi um religioso, sacerdote e missionário exemplar'
    id: 1020
  -
    name: 'Marcelle Mallet'
    saint_phrase: 'Ajudou o próximo, especialmente aqueles em dificuldades, realizando uma “caridade inventiva”, para tentar enfrentar os problemas de pobreza'
    id: 1021
  -
    name: 'Maria Benedetta Arias'
    saint_phrase: 'Manifestou seu amor pelo próximo, acolhendo grandes quantidades de meninas pobres e órfãs'
    id: 1022
  -
    name: 'Margherita do Sagrado Coração de Jesus (nome de nascimento: Virginia De Brincat)'
    saint_phrase: '«O fruto do Amor é que muitas vezes me parece que estou queimando... Oh, mergulhemos naquele oceano de Amor infinito, de Amor eterno!... Amemo-lo até a loucura!»'
    id: 1023
  -
    name: 'Serafina Cinque (nome de nascimento: Noemy)'
    saint_phrase: 'No carisma das Adoradoras do Sangue de Cristo, encontrou um clima plenamente adequado ao seu projeto espiritual, a ser realizado com simplicidade, pureza e disponibilidade às necessidades materiais e espirituais do seu povo'
    id: 1024
  -
    name: 'Jesús María Echavarría y Aguirre'
    saint_phrase: 'A luz de sua fé não se apagou nem mesmo durante os dois exílios. Sua fé era constantemente alimentada pela oração'
    id: 1025
  -
    name: 'Faustino Ghilardi (nome de nascimento: Guglielmo Giacomo)'
    saint_phrase: 'Soube incorporar a figura do verdadeiro frade menor, como descrito em seus textos formativos e proposto primeiro a si mesmo do que aos outros'
    id: 1026
  -
    name: 'María Rocío de Jesús Crucificado (nome de nascimento: María Josefa Rodríguez Xuárez de la Guardia)'
    saint_phrase: 'Foi capaz de difundir a luz da fé ao seu redor com alegria evangélica. Seu testemunho pode ser indicado aos jovens e aos religiosos como modelo de mulher feliz em sua vocação'
    id: 1027
  -
    name: 'Francisco Simón y Ródenas'
    saint_phrase: 'Como religioso capuchinho, missionário e Bispo, mostrou-se sempre eminentemente bom, de altíssima espiritualidade, penitente, dedicado à contemplação e à evangelização'
    id: 1028
  -
    name: 'Adolfo Barberis'
    saint_phrase: '“Estou feliz por sempre ter pertencido à Igreja Católica, alegro-me em morrer seu Sacerdote, mesmo que eu me envergonhe de ter sido às vezes mau e sempre medíocre. Saúdo moriturus o Santo Padre, Vigário do meu Soberano Jesus Cristo, saúdo Roma, minha doce Pátria terrena”'
    id: 1029
  -
    name: 'Marie-Clément Staub (nome de nascimento: Joseph)'
    saint_phrase: '“O Sagrado Coração me fez a graça de uma confiança ilimitada Nele: me concede ousar muito com Ele. Eu compreendo que os sucessos vêm Dele e, creio, eu busco devolver a Ele a honra”'
    id: 1030
  -
    name: 'Sebastião Elorza Arizmendi'
    saint_phrase: 'Proseguiu no caminho para a santidade através da simplicidade de vida e do exercício diário das virtudes cristãs, preenchendo-o de significado humano e espiritual'
    id: 1031
  -
    name: 'Maria Teresa de Jesus Eucarístico (nome secular: Dulce Rodrigues dos Santos)'
    saint_phrase: '«Sejam santas, sejam fiéis ao Papa, à Igreja e às Constituições. Amem muito o Santíssimo Sacramento e Nossa Senhora, estejam unidas e assim serão felizes»'
    id: 1032
  -
    name: 'Clara da Conceição (nome secular: Juana de la Concepción Sánchez García)'
    saint_phrase: 'Antes de ser abadessa, era a mãe de todas as monjas, o que a comprometia acima de tudo era o amor que tinha e expressava por cada uma de suas novícias'
    id: 1033
  -
    name: 'Maria Madalena de Jesus Sacramentado (nome secular: Maria Giuseppina Teresa Marcucci)'
    saint_phrase: 'Um profundo espírito de pobreza e humildade se manifestava em seus comportamentos e em seu trato, gentil e austero ao mesmo tempo, e especialmente na caridade que teve para com as irmãs'
    id: 1034
  -
    name: 'Luís Rocchi'
    saint_phrase: '«Sentir-se um nada, mas um nada visitado por Deus»'
    id: 1035
  -
    name: 'Alain Marie Guynot de Boismenu'
    saint_phrase: '«Deus é bom; Confiemos Nele»'
    id: 1036
  -
    name: 'Wilhelm Janauschek'
    saint_phrase: '“O Sagrado Coração me concedeu a graça de uma confiança ilimitada Nele: me permite ousar muito com Ele. Eu compreendo que os sucessos vêm Dele e, creio, eu busco devolver a Ele a honra”'
    id: 1037
  -
    name: 'Jacinto Alegre Pujals'
    saint_phrase: 'Trabalhou constantemente em favor dos sofredores de todo tipo, em estreita conexão com uma profunda união de oração com o Senhor'
    id: 1038
  -
    name: 'Caroline Barbe Colchen Carré de Malberg'
    saint_phrase: 'Viveu com profunda fé a morte de todos os quatro filhos'
    id: 1039
  -
    name: 'Luís Savaré'
    saint_phrase: 'Seus constantes pontos de referência foram: o amor ao Santíssimo Sacramento e à Madonna, a meditação pessoal da Sagrada Escritura acompanhada do estudo, a veneração dos Santos, assumidos como modelos'
    id: 1040
  -
    name: 'Eugênio Reffo'
    saint_phrase: 'Ama nescire, abnege temetipsum, da mihi animas, coetera tolle'
    id: 1041
  -
    name: 'Magdalena do Sagrado Coração (al secolo: Frances Margaret Taylor)'
    saint_phrase: 'Não só trabalhou pelos pobres, mas com os pobres, identificando-se com eles, considerando-os irmãos e irmãs em Cristo'
    id: 1042
  -
    name: 'Maria Giuseppa Scandola'
    saint_phrase: 'Foi a primeira mulher que, no século XIX, entrou na África como missionária e viveu as sofrências e os desconfortos do território e da terrível situação social e política do período'
    id: 1043
  -
    name: 'Humberto Mori'
    saint_phrase: 'Dedica-se, sem reservas e com empenho generoso, à evangelização'
    id: 1044
  -
    name: 'Antônio Ferreira Viçoso'
    saint_phrase: 'Defendeu bravamente o direito da Igreja de salvaguardar a formação cristã da juventude nas escolas e nas Universidades'
    id: 1045
  -
    name: 'Saturnino López Novoa'
    saint_phrase: 'Austero consigo mesmo, não perdeu a paz mesmo nos momentos mais atribulados da vida'
    id: 1046
  -
    name: 'José Augusto Arribat'
    saint_phrase: 'A sua foi uma santidade caracterizada pela “ordinariedade” de uma vida gasta totalmente ao serviço de Deus e do próximo'
    id: 1047
  -
    name: 'Mãe Verônica da Paixão (al secolo: Sophie Leeves)'
    saint_phrase: 'A sua fé foi impregnada de oração e de Sagrada Escritura e se fortaleceu na sua adesão à Igreja católica'
    id: 1048
  -
    name: 'Elena da Persico'
    saint_phrase: '“Conservar a lâmpada acesa e a morte será um sorriso”'
    id: 1049
  -
    name: 'Gaetana do Santíssimo Sacramento (al secolo: Maria Carlotta Fontana)'
    saint_phrase: '“Jesus, tudo por ti, tudo por ti, para o bem da Comunidade”'
    id: 1050
  -
    name: 'Marcelo Candia'
    saint_phrase: 'Consciente de que a posse dos bens está imprescindivelmente ligada a uma enorme responsabilidade para com os irmãos que carecem do indispensável, fez da partilha fraterna um pilar fundamental de sua vida'
    id: 1051
  -
    name: 'Hildebrando Gregori (no século: Alfredo Antônio)'
    saint_phrase: '“A palavra final em manus tuas commendo spiritum meum é o programa pascal e vital da Sua e da minha existência, dia após dia; obra por obra: tudo tomará sabor de fiat; e, na obra final, passaremos para o Paraíso com Ele”'
    id: 1052
  -
    name: 'Francisco Maximiano Valdés Subercaseaux'
    saint_phrase: '“Minha vocação é viver com os pobres e compartilhar sua sorte”'
    id: 1053
  -
    name: 'Raimundo Calcagno'
    saint_phrase: '“A santidade consiste em fazer com grande amor a Deus as coisas ordinárias da vida”'
    id: 1054
  -
    name: 'Pelágio Saúter'
    saint_phrase: 'Seus dias foram uma oração contínua, especialmente com a recitação do Santo Rosário'
    id: 1055
  -
    name: 'Jeanne Mance'
    saint_phrase: 'Soube suportar as dificuldades com paciência e firmeza, tanto que foi considerada a “alma” dos colonos missionários e uma das fundadoras da cidade de Montréal'
    id: 1056
  -
    name: 'Marthe Louise Robin'
    saint_phrase: 'Viveu um “laicato consagrado”, indicando a vocação universal à santidade e oferecendo um testemunho credível de sua vocação à evangelização do mundo'
    id: 1057
  -
    name: 'Silvio Dissegna'
    saint_phrase: '“Toda a minha dor seja um gesto de amor por ti, ó Jesus”'
    id: 1058
  -
    name: 'Carmela de Jesus (no século: Francesca Prestigiacomo)'
    saint_phrase: '“Querer sempre o que Deus quer, como Ele quer e quando Ele quer”'
    id: 1059
  -
    name: 'Maria Séiquer Gayá'
    saint_phrase: '"Estou como Deus quer e Estou nas mãos de Deus"'
    id: 1060
  -
    name: 'Vojtěcha (Adalberta) Hasmandová'
    saint_phrase: 'Durante a prisão, permaneceu sempre fiel ao Senhor, buscando irradiar o amor de Deus colocando-se a serviço do próximo'
    id: 1061
  -
    name: 'Práxedes Fernández García'
    saint_phrase: 'Recebia os necessitados em casa, os lavava e vestia, fazendo-os depois sentar à mesa. A virtude da compaixão foi a característica de toda a sua vida'
    id: 1062
  -
    name: 'Elisabetta Tasca Serena'
    saint_phrase: '«Em minha casa, Deus manda»'
    id: 1063
  -
    name: 'Luigi Schwartz'
    saint_phrase: 'Mesmo quando recebeu a notícia de sua grave doença e das escassas probabilidades de sobrevivência a longo prazo, não mudou seu modo de ser, mas acolheu tudo com serenidade interior'
    id: 1064
  -
    name: 'Cointa Jáuregui Osés'
    saint_phrase: 'A Eucaristia, recebida e adorada, foi sempre o centro de sua vida'
    id: 1065
  -
    name: 'Teresa Gardi'
    saint_phrase: 'Quanto às suas experiências místicas, ela nunca se vangloriou, buscando, na verdade, ocultá-las e revelá-las com grande pudor apenas ao diretor espiritual e ao confessore'
    id: 1066
  -
    name: 'Luigi Trelles y Noguerol'
    saint_phrase: 'A fé foi o respirar de sua alma, desde pequeno. A aprofundou nos vários colégios onde foi enviado e a viveu em seu apostolado'
    id: 1067
  -
    name: 'Elisabetta Maria Satoko Kitahara'
    saint_phrase: 'Viveu uma vida sacramental assídua, uma constante meditação do mistério da vida, morte e ressurreição do Senhor e uma devoção filial à Virgem Maria'
    id: 1068
  -
    name: 'Virginia Blanco Tardío'
    saint_phrase: 'Nutrita pela Palavra de Deus, dedicou-se incansavelmente à ajuda dos menos favorecidos. Despojou-se do patrimônio pessoal herdado da família, para servir os necessitados'
    id: 1069
  -
    name: 'Giovanni Bacile'
    saint_phrase: 'Foi excepcional na ordinariedade da pastoral, servo apaixonado da salus animarum, pobre entre os pobres e rico em sã doutrina'
    id: 1070
  -
    name: 'Francesco Gattola'
    saint_phrase: '“Amar a Deus na luz do próximo e amar o próximo na luz de Deus”'
    id: 1071
  -
    name: 'Pietro Barbarić'
    saint_phrase: 'Aceitou a doença abandonado à vontade divina, mas também animado por profunda confiança e esperança'
    id: 1072
  -
    name: 'Maria Aikenhead'
    saint_phrase: 'Sustentada por uma esperança inabalável, conseguiu expandir sua obra, devolvendo confiança ao povo desesperado'
    id: 1073
  -
    name: 'Elisabetta Baldo'
    saint_phrase: 'Aceitou com serenidade a vontade de Deus e tanto na oração quanto na humildade em relação aos pobres, revestiu-se de humildade'
    id: 1074
  -
    name: 'Vincenza della Passione del Signore (nome secular: Edvige Jaroszewska)'
    saint_phrase: 'Buscou encarnar o mandamento do amor, especialmente para com os mais pobres, os abandonados, os pecadores e aqueles que vivem longe de Deus'
    id: 1075
  -
    name: 'Maria Orsola Bussone'
    saint_phrase: '“Entendi que a única coisa que traz felicidade é Deus. Então decidi escolhê-lo como o tudo da minha vida"'
    id: 1076
  -
    name: 'Antonio Antić'
    saint_phrase: 'Foi um religioso de extraordinária piedade, muito ligado à sua Ordem, em tudo obediente à Regra'
    id: 1077
  -
    name: 'Giulia Colbert em Falletti di Barolo'
    saint_phrase: 'Viveu intensamente sua vocação leiga e contribuiu para a santificação do mundo, dando um testemunho fecundo de fé, esperança e caridade admirável'
    id: 1078
  -
    name: 'Brigida Maria Postorino'
    saint_phrase: 'De seu amor por Deus brotava uma força inesgotável para fazer o bem a quantos encontrava, em particular pobres e necessitados'
    id: 1079
  -
    name: 'Raffaela Maria di Gesù Ostia (nome secular: Martínez-Cañavate Ballesteros)'
    saint_phrase: 'Escolheu a pobreza como estilo de vida e o clausura como a expressão mais qualificada'
    id: 1080
  -
    name: 'Sérgio Bernardini e Domênica Bedonni'
    saint_phrase: '"Todos acreditam que somos bons: precisamos realmente ser, caso contrário enganamos as pessoas e grande será nossa responsabilidade"'
    id: 1081
  -
    name: 'Antônio Celona'
    saint_phrase: 'Com seu apostolado, contribuiu para a renascença espiritual e moral dos jovens e dos fracos'
    id: 1082
  -
    name: 'Otorrino Zanon'
    saint_phrase: 'A fé firme, o abandono constante à Divina Providência, o amor profundo por Jesus, a grande caridade para com os jovens pobres, para os quais foi um pai atencioso e cuidadoso'
    id: 1083
  -
    name: 'Marcelo Labor'
    saint_phrase: 'Foi incansável pelos doentes. Era chamado de “médico dos pobres”, sempre presente ao seu leito e generoso em fornecer medicamentos e alimentos'
    id: 1084
  -
    name: 'Maria Antônia do Sagrado Coração de Jesus (no século: Raquel Lalìa)'
    saint_phrase: 'A força profética de seu anseio missionário e ecumênico e a capacidade de renovar o carisma dominicano sempre buscando suas origens'
    id: 1085
  -
    name: 'André Szeptyckyj (no século: Romano Alessandro Maria)'
    saint_phrase: '"O único tema da minha pregação sempre foi o Evangelho de Jesus Cristo, o único objetivo do meu trabalho, a salvação dos fiéis”'
    id: 1086
  -
    name: 'José Carraro'
    saint_phrase: 'Exerceu o amor ao próximo, especialmente em relação aos pobres e visitava regularmente os hospitais, as refeições dos pobres e as prisões'
    id: 1087
  -
    name: 'Agostinho Ramírez Barba'
    saint_phrase: 'Viveu o sacerdócio como instrumento da misericórdia de Deus, que procurou transmitir aos fiéis principalmente através do Sacramento da Reconciliação'
    id: 1088
  -
    name: 'Simpliciano da Natividade (no século: Aniello Francesco Saverio Maresca)'
    saint_phrase: 'Viveu a caridade para com o próximo, especialmente em relação àqueles que foram os destinatários de seu amor cuidadoso de pai e irmão: as prostitutas, os doentes, mas também as irmãs e os confrades franciscanos'
    id: 1089
  -
    name: 'Maria do Refúgio Aguilar y Torres, viúva Cancino'
    saint_phrase: 'A maternidade biológica se transformou em maternidade espiritual tanto para as jovens que entravam na Congregação, incluindo sua própria filha, quanto para as pessoas necessitadas e indigentes'
    id: 1090
  -
    name: 'Maria Teresa Dupouy Bordes'
    saint_phrase: 'Remanecia longas horas diante do Tabernáculo, dedicava-se com paixão ao cuidado da liturgia e da sacristia, colocou em prática a missão em favor das vocações sacerdotais'
    id: 1091
  -
    name: 'Elisa Miceli'
    saint_phrase: 'De extração social burguesa, colocou-se a serviço dos últimos para a formação religiosa e a promoção humana. Na oração, amadureceu as escolhas mais importantes da vida'
    id: 1092
  -
    name: 'Isabella Méndez Herrero (em religião: Isabella de Maria Imaculada)'
    id: 1093
  -
    name: 'Giovanni Folci'
    saint_phrase: 'Manifestou o amor por Deus antes de tudo na vida sacramental, vivendo com intensidade o ministério sacerdotal'
    id: 1094
  -
    name: 'Francesco Blachnicki'
    saint_phrase: 'A virtude principal que ele viveu foi a da fé, à qual submeteu e consagrou tudo em sua vida. Desejou cumprir sempre e em qualquer circunstância a vontade de Deus'
    id: 1095
  -
    name: 'Giuseppe Rivera Ramírez'
    saint_phrase: '“Tudo é graça e o Amor de Deus faz brotar bondade, verdade, beleza como ornamento de quem serve a Deus e o anuncia e testemunha ao mundo”'
    id: 1096
  -
    name: 'Giovanni Emanuele Martín del Campo'
    saint_phrase: 'Foi um sacerdote zeloso, um apóstolo incansável, que consumiu sua vida no apaixonado serviço a Deus e ao próximo'
    id: 1097
  -
    name: 'Antonio Filomeno Maria Losito'
    saint_phrase: 'Por causa da confiança infinita em Deus, foi definido como “anjo consolador” por aqueles que o procuravam em suas aflições e sofrimentos'
    id: 1098
  -
    name: 'Maria Benedetta Giuseppa Frey (no século: Ersilia Penelope)'
    saint_phrase: 'Sua cama de dor foi seu lugar de apostolado e caridade, contagiando positivamente todos aqueles que a frequentavam e que estavam em contato epistolar com ela'
    id: 1099
  -
    name: 'Angelo Ramazzotti'
    saint_phrase: 'Sem descuidar seu próprio ambiente de vida, soube olhar para os extremos limites da terra e para todos os povos ainda não evangelizados'
    id: 1100
  -
    name: 'Giuseppe Vithayathil'
    saint_phrase: 'Homem manso, soube estar perto dos pobres e dos doentes, mesmo os mais graves, atingidos pela lepra e pela varíola, aos órfãos e às famílias'
    id: 1101
  -
    name: 'Giuseppe Maria Arizmendiarrieta'
    saint_phrase: 'Abandonado à vontade divina, abraçou o conselho evangélico da pobreza como regra constante de vida e instrumento de mais íntima união com o Senhor'
    id: 1102
  -
    name: 'Venâncio Maria Quadri (ao século: Antônio)'
    saint_phrase: '“Amo o próximo, porque amo Deus… portanto, resulta que devo fugir das simpatias e antipatias; devo amar a todos com o mesmo amor, não tendo outra coisa em vista senão Deus”'
    id: 1103
  -
    name: 'Guilherme Gagnon'
    saint_phrase: 'Dedicou-se totalmente ao Senhor e à pregação do Evangelho em uma terra difícil, marcada pela guerra além da miséria'
    id: 1104
  -
    name: 'Teresa Rosa Ferdinanda de Saldanha Oliveira e Sousa'
    saint_phrase: 'Foi uma reformadora da vida religiosa em todo Portugal e soube constituir uma espécie de presídio eclesial em uma época de forte anticlericalismo'
    id: 1105
  -
    name: 'Maria Esperança da Cruz (ao século: Salustiana Antonia Ayerbe Castillo)'
    saint_phrase: 'Exigia que em todas as Comunidades fossem socorridos os pobres que batiam à porta do convento, mesmo privando-se do seu necessário'
    id: 1106
  -
    name: 'Emanuela Maria Madalena Kalb (ao século: Helena)'
    saint_phrase: 'Filha de Israel e filha da Igreja Católica, consagrada e professora, correspondeu de forma convicta ao amor de Cristo, cumprindo as tarefas diárias totalmente abandonada a Ele'
    id: 1107
  -
    name: 'Nicola Wolf'
    saint_phrase: 'Considerado por muitos como um pai da fé católica na Suíça, lutou com seu testemunho contra o racionalismo iluminista'
    id: 1108
  -
    name: 'Adolfo (ao século: Leonardo Lanzuela Martínez)'
    saint_phrase: 'Com o conselho e as exortações, ele encorajava e sustentava a virtude da esperança em todos que encontrava, em particular nos doentes que visitava frequentemente'
    id: 1109
  -
    name: 'Henrique Hahn'
    saint_phrase: 'Exerceu uma caridade extraordinária para com os doentes, oferecendo exemplos de heroísmo durante as epidemias e guerras, mas também todos os dias, nas relações com os pacientes, especialmente os mais pobres'
    id: 1110
  -
    name: 'Stefano Ferrando'
    saint_phrase: 'Missionário e Bispo, ele se mostrou sempre eminentemente bom, de altíssima espiritualidade, penitente, dedicado à contemplação e à evangelização'
    id: 1111
  -
    name: 'Henrique Batista Stanislau Verjus'
    saint_phrase: 'Seu grande mérito foi ter fundado a Igreja Católica na ilha melanesiana da Nova Guiné, em circunstâncias muito difíceis e em duras condições de vida'
    id: 1112
  -
    name: 'João Batista Quilici'
    saint_phrase: 'Durante sua breve e intensa vida sacerdotal, mostrou ser um pastor com “o cheiro das ovelhas” que ia à procura dos fiéis, especialmente os distantes, os pobres, as mulheres e os encarcerados'
    id: 1113
  -
    name: 'Bernardo Mattio'
    saint_phrase: 'Nutría a pregação, a catequese e as atividades caritativas e sociais com uma intensa vida de oração'
    id: 1114
  -
    name: 'Quirico Pignalberi'
    saint_phrase: 'Desempenhou seu serviço em humildade e ocultamento, testemunhando, em primeiro lugar aos noviços, sua vida de oração e de penitência. Pontos de referência de sua vida foram a Eucaristia e a Imaculada'
    id: 1115
  -
    name: 'Teodora Campostrini'
    saint_phrase: 'Sensível às necessidades da sociedade de seu tempo, tanto que integrou o desejo de uma vida claustral com a formação gratuita das jovens gerações'
    id: 1116
  -
    name: 'Bianca Piccolomini Clementini'
    saint_phrase: 'Sua profunda fé, aprendida na família e alimentada pela oração, em particular pela Adoração Eucarística como reparação em favor dos sacerdotes e das pessoas consagradas'
    id: 1117
  -
    name: 'Maria Nieves da Sagrada Família'
    saint_phrase: 'Sua espiritualidade foi principalmente trinitária, eucarística, mariana, profundamente enraizada na tradição ascética e educativa das Escolápias'
    id: 1118
  -
    name: 'Tomás Choe Yang-Eop'
    saint_phrase: 'Deu-se completamente à causa do Evangelho, não poupando esforços para nutrir e gerar novos discípulos de Jesus'
    id: 1119
  -
    name: 'Sósio Del Prete (no século: Vincenzo)'
    saint_phrase: 'Amou ternamente a Igreja, manifestando uma peculiar veneração pelo Santo Padre'
    id: 1120
  -
    name: 'Venâncio Katarzyniec (nome secular: José)'
    saint_phrase: 'Destacou-se por uma profunda fé alimentada pela oração diária, em particular pela participação na celebração Eucarística e pela devoção à Virgem Maria'
    id: 1121
  -
    name: 'Maria Conselho do Espírito Santo (nome secular: Emília Pasqualina Addatis)'
    saint_phrase: 'Depositou sua confiança apenas no Senhor, a quem manifestou profundo amor, especialmente na devoção eucarística'
    id: 1122
  -
    name: 'Maria da Encarnação (nome secular: Catarina Carrasco Tenorio)'
    saint_phrase: 'Como São Francisco costumava repetir: “Meu Deus e meu tudo”'
    id: 1123
  -
    name: 'Maria Laura Baraggia'
    saint_phrase: 'Desde pequena, mostrou um amor ardente por Jesus Crucificado e uma consequente forte consciência do pecado e da necessária reparação'
    id: 1124
  -
    name: 'Ilia Corsaro'
    saint_phrase: 'A aspiração inicial à vida contemplativa se transformou em um exercício exemplar também de “vida ativa”'
    id: 1125
  -
    name: 'Maria Montserrat Grases García'
    saint_phrase: '“Senhor, o que tu queres, como tu queres, quando tu queres”'
    id: 1126
  -
    name: 'Rafael Emanuele Almansa Riaño'
    saint_phrase: 'Homem de oração profunda, passava longos períodos de tempo diante do tabernáculo, em intimidade com o Senhor'
    id: 1127
  -
    name: 'Antônio Cirillo Stojan'
    saint_phrase: 'Era considerado pelos colegas deputados como defensor da Igreja, guardião da fé, embaixador de Deus'
    id: 1128
  -
    name: 'Vincenzo Garrido Pastor'
    saint_phrase: 'Manifestava uma confiança total na Divina Providência, especialmente nos momentos difíceis, como durante a perseguição religiosa na Guerra Civil Espanhola'
    id: 1129
  -
    name: 'Paulo Maria Guzmán Figueroa (nome secular: José Bardomiano de Jesus)'
    saint_phrase: 'Seu anseio constante foi alcançar a santidade e se empenhar com todas as forças no apostolado'
    id: 1130
  -
    name: 'Luigi Lo Verde (al secolo: Filippo)'
    saint_phrase: 'Desde sempre ele manifestou o propósito de “se fazer santo, grande santo e logo santo”'
    id: 1131
  -
    name: 'Bernardo da Anunciação (al secolo: Bernardo de Vasconcelos)'
    saint_phrase: 'Desde sempre ele manifestou a aspiração à perfeição. Nos seus escritos se encontra uma delicadeza de ânimo e uma tensão para o infinito'
    id: 1132
  -
    name: 'Maria Elisa Oliver Molina'
    saint_phrase: 'Deu prova do seu grande amor pelo Senhor tanto na observância dos seus mandamentos quanto através da fervorosa oração e da aceitação das provas'
    id: 1133
  -
    name: 'Maria de Jesus do Amor Misericordioso (al secolo: Maria de Jesus Guízar Barragán)'
    saint_phrase: 'Todos aqueles que a conheceram foram tocados pela sua constante presença com o Senhor com grande amor'
    id: 1134
  -
    name: 'Alfonso Gallegos'
    saint_phrase: 'Sua obra pastoral não negligenciava nenhum aspecto ao se fazer presente efetivamente em todas as formas de pobreza, que compartilhava no dia a dia'
    id: 1135
  -
    name: 'Rafael Sánchez García'
    saint_phrase: 'Nutria a pregação, a catequese e as atividades caritativas e sociais com uma intensa vida de oração'
    id: 1136
  -
    name: 'André Filomeno García Acosta'
    saint_phrase: 'Fiel às devoções tradicionais da Ordem Franciscana, divulgou, sobretudo entre os trabalhadores, a prática da Via Crucis e a devoção ao Menino Jesus e à Virgem Maria'
    id: 1137
  -
    name: 'José Marchetti'
    saint_phrase: '“Pai dos órfãos dos migrantes abandonados”'
    id: 1138
  -
    name: 'Tiago Viale'
    saint_phrase: 'Foi cheio de zelo no caminho espiritual. Orava frequentemente também à noite e, no diálogo com Deus, abençoava seus paroquianos'
    id: 1139
  -
    name: 'Maria Pia da Cruz (al secolo: Madalena Notari)'
    saint_phrase: 'O amor à Eucaristia se expressou também no grande cuidado que teve na confecção do pão e do vinho para a Missa'
    id: 1140
  -
    name: 'Luiz Zambrano Blanco'
    saint_phrase: 'Praticava a Adoração noturna, que colocou como regra do Instituto; amava passar muito tempo diante do Santíssimo'
    id: 1141
  -
    name: 'Maria Teresa Spinelli'
    saint_phrase: 'Mulher dotada de uma inteligência viva, autodidata de ampla cultura e de profunda vida ascética, fez escolhas radicais e contrárias à corrente'
    id: 1142
  -
    name: 'Guilherme Massaja'
    saint_phrase: 'Sua fisionomia humana e religiosa, seu forte temperamento caracterial e sua intensa espiritualidade o sustentaram na complexa e difícil atividade apostólica e missionária em um território ainda em boa parte desconhecido e inexplorado'
    id: 1143
  -
    name: 'Núncio Russo'
    saint_phrase: 'Viveu com humildade e fidelidade seus deveres; foi sereno mesmo nos momentos difíceis e na fadiga; teve um zelo ardente pelo bem das almas'
    id: 1144
  -
    name: 'José Bau Burguet'
    saint_phrase: 'Nutría a pregação, a catequese e as atividades caritativas e sociais com uma intensa vida de oração, fundamentada na meditação e no estudo da Sagrada Escritura'
    id: 1145
  -
    name: 'Maria Giuseppa Aubert (ao seculo: Susanna)'
    saint_phrase: 'Sua profunda fé animou e sustentou suas obras, em particular a formação das religiosas'
    id: 1146
  -
    name: 'Luz Rodríguez-Casanova e García San Miguel'
    saint_phrase: 'Da intensidade de seu amor a Cristo brotou seu compromisso generoso apostólico'
    id: 1147
  -
    name: 'Catarina Aurélia do Preciosíssimo Sangue (ao seculo: Aurélia Caouette)'
    saint_phrase: 'O amor por Deus foi tão profundo que a fez experimentar fenômenos místicos, que ela nunca exibiu'
    id: 1148
  -
    name: 'Leônia Maria Nastał'
    saint_phrase: 'Teve a prova da escuridão do espírito, com uma forte consciência de seus pecados'
    id: 1149
  -
    name: 'Lorenzo do Espírito Santo (ao seculo: Egídio Marcelli)'
    saint_phrase: 'Exerceu de forma heroica as virtudes, na quotidianidade da vida, na humildade, no silêncio, na oração e no serviço generoso'
    id: 1150
  -
    name: 'Maria Raffaella do Sagrado Coração de Jesus (nome de nascimento: Sebastiana Lladó y Sala)'
    saint_phrase: 'Em um contexto em que a direção espiritual era reservada aos clérigos, tornou-se guia espiritual de muitas jovens'
    id: 1151
  -
    name: 'Isidoro Zorzano Ledesma'
    saint_phrase: 'É um exemplo luminoso de crente que se empenha pela santificação do mundo, vivendo a fidelidade alegre a Jesus'
    id: 1152
  -
    name: 'Raimundo Jardón Herrera'
    saint_phrase: 'Foi particularmente enérgico e claro nos momentos mais difíceis de seu apostolado e continuou a desempenhá-lo com dedicação e espírito de sacrifício'
    id: 1153
  -
    name: 'João Sáez Hurtado'
    saint_phrase: 'Seu objetivo foi a santidade vivida, contagiando todos aqueles que o encontravam, os quais eram impactados por seu estilo simples e pobre e pela intensa piedade e caridade pastoral'
    id: 1154
  -
    name: 'Inácio Beschin (nome de nascimento: Giuseppe)'
    saint_phrase: 'Homem de cultura, foi capaz de relações humanas sinceras, com indiscutíveis dotes de governo e de guia espiritual'
    id: 1155
  -
    name: 'Giuseppe Wech Vandor'
    saint_phrase: 'Bebeu muito da oração e do diálogo com o Senhor, especialmente nos momentos mais difíceis de sua vida. Seus dois amores, desde jovem, foram a Eucaristia e Maria Imaculada'
    id: 1156
  -
    name: 'Francisco Convertini'
    saint_phrase: '“Minha mãe, eu nunca te desagradeci em vida, ajude-me agora!”'
    id: 1157
  -
    name: 'Santina Maria das Dores (De Pascali)'
    saint_phrase: 'Conservou a virtude da fé em cada momento de sua vida, cumprindo silenciosamente seu caminho de busca, confiante na ajuda divina'
    id: 1158
  -
    name: 'João Tyranowski'
    saint_phrase: 'Seus discursos eram simples e claros, fruto de sua profunda comunhão com Deus. Mesmo na cama do hospital, durante a doença, demonstrou uma inabalável confiança no Senhor'
    id: 1159
  -
    name: 'Otávio Ortiz Arrieta'
    saint_phrase: 'A radicalidade evangélica, tanto em seus comportamentos quanto em suas ações, deixava ver seu amor pelo Evangelho e seu desejo de que chegasse a todos'
    id: 1160
  -
    name: 'Antônio Provolo'
    saint_phrase: 'Foi um apóstolo da caridade, entregando-se sem reservas a Deus e ao próximo, buscando responder às necessidades pastorais da época e da Diocese'
    id: 1161
  -
    name: 'Antônio Repiso Martínez de Orbe'
    saint_phrase: 'Totalmente animado por um amor extraordinário a Deus e reconhecendo seu primado absoluto, atuou constantemente ad maiorem Dei gloriam'
    id: 1162
  -
    name: 'Maria da Mercede Cabezas Terrero'
    saint_phrase: 'Foi sempre determinada em cumprir antes de tudo a vontade de Deus, na busca da oração, na oferta total de sua vida, na obediência aos diretores espirituais, na particular sensibilidade para perceber a pobreza e as necessidades dos outros'
    id: 1163
  -
    name: 'Pedro Herrero Rubio'
    saint_phrase: 'Sua fé foi vivida e encarnada na vida cotidiana, cultivada com o estudo, a leitura, a oração contemplativa e a prática das virtudes'
    id: 1164
  -
    name: 'Vittório Trancanelli'
    saint_phrase: 'Sua vida foi marcada pela doença, que ele transformou em ocasião de amor e de testemunho sublimes'
    id: 1165
  -
    name: 'Daniel de Samarate (nome secular: Felice Rossini)'
    saint_phrase: 'A voz que ele ouviu interiormente o levou a acolher sua enfermidade como uma graça a ser vivida para o bem dele e da população que servia'
    id: 1166
  -
    name: 'Macrina Raparelli (nome secular: Elena)'
    saint_phrase: 'Soube unir as expressões de santidade tipicamente latinas, como a atenção aos pobres e as obras de caridade, com o ímpeto espiritual oriental'
    id: 1167
  -
    name: 'Daniela Zanetta'
    saint_phrase: '“Entendi que a cruz é parte integrante, essencial da minha vida; é como um cordão umbilical que me liga a Ti e do qual recebo nutrição, oxigênio e vida"'
    id: 1168
  -
    name: 'Elia da Costa'
    saint_phrase: 'Destacou-se pela austeridade de vida, ardor na governança e dedicação pastoral. Foi um autêntico profeta dos tempos'
    id: 1169
  -
    name: 'Francisco Xavier Nguyên Van Thuân'
    saint_phrase: 'Suas palavras eram tornadas autênticas por uma vida serena, sóbria e humilde, disponível ao diálogo com outras culturas e religiões'
    id: 1170
  -
    name: 'Joana Meneghini'
    saint_phrase: 'Sua existência foi impregnada de oração, caridade ativa e humildade'
    id: 1171
  -
    name: 'Vicência Cusmano'
    saint_phrase: 'Teve um amor profundíssimo por Jesus Eucaristia, vítima de amor, um amor que estendia naturalmente aos pobres'
    id: 1172
  -
    name: 'Alexandre Nottegar'
    saint_phrase: 'Foi capaz de escolhas radicais que perseguiu até o fim, sem hesitações, testemunhando o amor por Deus e pelos irmãos em um contínuo dom de si'
    id: 1173
  -
    name: 'Antônio José de Sousa Barroso'
    saint_phrase: 'Foi definido “um místico com os olhos abertos” pois sua sã diplomacia visava à resolução concreta dos problemas'
    id: 1174
  -
    name: 'José de Jesus López y González'
    saint_phrase: 'Vivia o que ensinava e sabia ver nos acontecimentos a mão paterna de Deus'
    id: 1175
  -
    name: 'Agostinho Ernesto Castrillo'
    saint_phrase: 'Soube fazer da comunhão e do serviço desinteressado ao povo de Deus seu estilo de vida'
    id: 1176
  -
    name: 'Tiago da Balduina (nome secular: Benjamim Filon)'
    saint_phrase: 'Em seu confessionário havia sempre uma longa fila de penitentes que desejavam se aproximar dele, que se apresentava sereno e rico de sabedoria e santidade'
    id: 1177
  -
    name: 'Humildade Patlán Sánchez (nome secular: Maria)'
    saint_phrase: 'A humildade, a oração, o sacrifício, a autoridade, a compreensão, o desapego e o perdão tornaram-se nela um hábito vivo e atrativo'
    id: 1178
  -
    name: 'Ismael Perdomo'
    saint_phrase: 'Viveu verdadeiramente de fé: uma fé testemunhada e ensinada, como demonstram seu empenho pela pregação, pelo ensino catequético, cujas cartas pastorais são uma clara demonstração'
    id: 1179
  -
    name: 'Luiz Kosiba (nome secular: Pedro)'
    saint_phrase: 'Com zelo dedicou-se ao apostolado, sabendo criar oportunidades de evangelização e de catequese, especialmente durante a coleta'
    id: 1180
  -
    name: 'Paula de Jesus Gil Cano'
    saint_phrase: 'Toda a sua vida foi um ato de dedicação ao próximo por amor a Deus'
    id: 1181
  -
    name: 'Maria Elisabetta Mazza'
    saint_phrase: 'Foi admirada pela piedade incomum e pelo zelo no apostolado. De seus escritos emerge a tensão em direção ao céu, que nutre sua esperança e a sustenta principalmente nos momentos difíceis'
    id: 1182
  -
    name: 'Serafino Kaszuba (nome de nascimento: Luigi Casimiro)'
    saint_phrase: 'Ia ao encontro de todos com confiança, benevolência e paciência e, por isso, foi estimado não apenas pelos católicos, mas também pelos ortodoxos'
    id: 1183
  -
    name: 'Magín Morera y Feixas'
    saint_phrase: 'Viveu profundamente a união com Deus e buscou em tudo a Sua vontade'
    id: 1184
  -
    name: 'Francisca do Espírito Santo (nome de nascimento: Carolina Baron)'
    saint_phrase: 'Emergia nela uma espiritualidade franciscana centrada no sofrimento de Jesus pela salvação das almas'
    id: 1185
  -
    name: 'Francisco Paulo Gravina'
    saint_phrase: 'Profundamente unido a Cristo mediante a participação diária na Santa Missa e uma intensa vida de oração, dedicou-se com grande atenção aos mais necessitados, em particular pobres, órfãos e mendigos'
    id: 1186
  -
    name: 'Bernardo de Baden'
    saint_phrase: 'Soube bem conjugar os ideais cavaleirescos do baixo Médioevo com a obra de concórdia, de justiça social, de socorro às viúvas, aos órfãos e aos indigentes'
    id: 1187
  -
    name: 'Gregório Fioravanti (nome de nascimento: Lodovico)'
    saint_phrase: 'Demonstrou-se fiel ao Senhor e à sua vocação franciscana, operando no oculto'
    id: 1188
  -
    name: 'Tomás Morales Pérez'
    saint_phrase: 'Viveu em contínua união com Deus, mantendo uma visão sobrenatural das pessoas, dos eventos e dos problemas'
    id: 1189
  -
    name: 'Marcelino da Capradosso (nome de nascimento: Giovanni Maoloni)'
    saint_phrase: 'Embora fosse analfabeto, tornou-se sábio na ciência de Deus e da santidade'
    id: 1190
  -
    name: 'Teresa Fardella viúva De Blasi'
    saint_phrase: 'A nota constante da sua vida foi o amor ao próximo'
    id: 1191
  -
    name: 'Alfonso Barzana'
    saint_phrase: 'Três foram os elementos que ele considerou indispensáveis para um autêntico missionário: a integridade dos costumes, a solidez da doutrina e o conhecimento da língua indígena'
    id: 1192
  -
    name: 'Ambrogio Grittani'
    saint_phrase: 'Não teve medo de “sujar as mãos”, chegando a tocar as misérias e as feridas do próximo necessitado'
    id: 1193
  -
    name: 'Anne-Marie Madeleine Delbrêl'
    saint_phrase: 'A Palavra de Deus iluminava cada uma de suas decisões. Sua caridade era sem fronteiras e sem limites, lúcida e inteligente'
    id: 1194
  -
    name: 'Bernardo Łubieński'
    saint_phrase: 'Aceitou com firmeza os graves limites físicos permanentes, que não o impediram de realizar sua missão sacerdotal'
    id: 1195
  -
    name: 'Cecilio Maria Cortinovis (no século: Antônio Pedro)'
    saint_phrase: 'A caridade que sempre o animou fez com que ele descobrisse as “periferias” até mesmo no centro de Milão, transformando-o em um testemunho da misericórdia de Deus'
    id: 1196
  -
    name: 'Giustina Schiapparoli'
    saint_phrase: 'Viveu no ocultamento e no silêncio, dedicando-se à oração e à acolhida das meninas em situação de vulnerabilidade, das quais cuidava pessoalmente'
    id: 1197
  -
    name: 'Maria Schiapparoli'
    saint_phrase: 'Era a “pequena serva” de todos, sempre atenta aos serviços mais humildes. Possuía a arte de educar'
    id: 1198
  -
    name: 'Maria Antonella Bordoni'
    saint_phrase: 'Teve a experiência de fenômenos místicos com grande reserva. Com simplicidade, submeteu-se também a investigações psicológicas, que excluíram qualquer forma de exaltação ou de patologia'
    id: 1199
  -
    name: 'Varghese Payapilly'
    saint_phrase: 'Foi um sacerdote zeloso totalmente identificado com o ministério e com a caridade pastoral'
    id: 1200
  -
    name: 'Emanuele Nunes Formigão'
    saint_phrase: 'Personagem de vasta cultura, dotado de um caráter forte, teve uma profunda devoção mariana que nutriu desde pequeno'
    id: 1201
  -
    name: 'Lodovico Longari'
    saint_phrase: 'Disponível à escuta e aberto às opiniões alheias, procurava envolver os confrades nas escolhas importantes'
    id: 1202
  -
    name: 'Elisabetta Bruyère'
    saint_phrase: 'Pobre, humilde, trabalhadora, esqueceu-se de si mesma para se colocar a serviço da Igreja e do Papa'
    id: 1203
  -
    name: 'Margherita Ricci Curbastro (ao século: Costanza)'
    saint_phrase: 'Sua espiritualidade era centrada na reparação, que soube encarnar também se oferecendo como vítima pela salvação dos pecadores'
    id: 1204
  -
    name: 'Florenza Giovanna Profilio'
    saint_phrase: 'Os eventos alegres e dolorosos da vida a forjaram e tornaram cada vez mais livre e forte'
    id: 1205
  -
    name: 'Maria Dolores di Cristo Re (ao século: Maria Di Majo)'
    saint_phrase: 'Sentiu-se sempre sustentada pelo pensamento do Céu, aceitando com simplicidade, serenidade e confiança as sofrimentos e as humilhações'
    id: 1206
  -
    name: 'Justa Domínguez de Vidaurreta e Idoy'
    saint_phrase: 'Em cada circunstância, buscou sinceramente a vontade de Deus'
    id: 1207
  -
    name: 'Augusto Giuseppe Hlond'
    saint_phrase: 'O lema salesiano – da mihi animas caetera tolle – tornou-se seu projeto de vida'
    id: 1208
  -
    name: 'Michele Angelo Builes'
    saint_phrase: 'Em cada atividade, confiou em Deus com total obediência e entregando-se com fé sólida em Suas mãos'
    id: 1209
  -
    name: 'Enrico Mauri'
    saint_phrase: 'Dedicou suas energias à pastoral do matrimônio, visto como caminho de santidade'
    id: 1210
  -
    name: 'João Batista Berthier'
    saint_phrase: '“Quero adquirir o espírito de oração e de humildade (…) a oração será a vida da minha alma”'
    id: 1211
  -
    name: 'Guilherme Eberschweiler'
    saint_phrase: 'Animado pela confiança na Providência e no amor paternal de Deus, combateu toda forma de tristeza e desolação, conseguindo infundir esperança nos outros'
    id: 1212
  -
    name: 'Pedro Uccelli'
    saint_phrase: 'Soube fazer da sua vida uma escola de santidade e um modo de estar a completo serviço da Igreja para a anunciação do Evangelho'
    id: 1213
  -
    name: 'Pio Dellepiane'
    saint_phrase: 'Pela sua capacidade de conselho, de discernimento espiritual e de doçura no trato, muitos fiéis, sacerdotes e religiosos acorriam numerosos ao seu confessionário'
    id: 1214
  -
    name: 'Norberto (nome de nascimento: João McAuliffe)'
    saint_phrase: 'Vendo-o orar regularmente diante do tabernáculo, os fiéis o chamavam de “o homem que ora”'
    id: 1215
  -
    name: 'Francisca das Chagas de Jesus (nome de nascimento: Colomba Antonia Martí y Valls)'
    saint_phrase: 'Desde jovem, maturou o desejo de se consagrar totalmente ao Senhor, apesar da oposição do pai'
    id: 1216
  -
    name: 'Eleonora de Santa Maria (nome de nascimento: Isora Maria Ocampo)'
    saint_phrase: 'Seu caminho de perfeição foi em contínua ascensão, mesmo com “dons místicos”, que descreveu na autobiografia sem ostentação e por obediência ao confessor'
    id: 1217
  -
    name: 'Angela Maria do Coração de Jesus (nome de nascimento: Maria Cecilia Autsch)'
    saint_phrase: 'No campo de concentração, colocou em prática uma caridade heroica para com todos, inclusive os algozes. Pela sua dedicação, foi chamada de “o Anjo de Auschwitz”'
    id: 1218
  -
    name: 'Maria Edvige Zivelonghi'
    saint_phrase: '“Nós seguimos o caminho simples e damos ao Senhor tudo o que podemos dar. O importante é dar tudo o que se pode”'
    id: 1219
  -
    name: 'Pedro Di Vitale'
    saint_phrase: 'Enfrentou as sofrimentos físicos e psíquicos com serenidade e fortaleza, tanto que quem podia se aproximar dele ficava edificado por sua atitude de fé'
    id: 1220
  -
    name: 'Jorge La Pira'
    saint_phrase: 'Olhou para a esperança cristã como sua certeza de vida'
    id: 1221
  -
    name: 'Alessia González-Barros y González'
    saint_phrase: 'O sofrimento, que a colocou em união com Jesus Crucificado e Ressuscitado, se transformou em amor terno que envolveu os pais e se dirigiu ao próximo'
    id: 1222
  -
    name: 'João Jacono'
    saint_phrase: 'Seu confessionário estava sempre lotado e muitos entre os sacerdotes iam até ele para a direção espiritual e a confissão'
    id: 1223
  -
    name: 'Alfredo Maria Obviar'
    saint_phrase: 'Frequentemente repetia seu lema episcopal “Eu busco o teu rosto, Senhor”, tornando-o um programa de vida na oração silenciosa'
    id: 1224
  -
    name: 'João Ciresola'
    saint_phrase: 'Conseguia transmitir aos fiéis sua riqueza espiritual com ardor, propondo a santidade do cotidiano'
    id: 1225
  -
    name: 'Luís Bosio'
    saint_phrase: 'Às críticas que recebia, respondia com silêncio e abnegação, intensificando o zelo pela salvação das almas'
    id: 1226
  -
    name: 'Luís Maria Raineri'
    saint_phrase: 'Alcançou o ápice do crescimento espiritual durante a última doença, que aceitou com serenidade, ciente de estar próximo do encontro com o Pai'
    id: 1227
  -
    name: 'Rafaela da Paixão (nome secular: Rafaela Veintemilla Villacís)'
    saint_phrase: 'Viveu uma forma de vida semelhante à monástica com votos privados, horas de oração e devoção, unindo vida contemplativa, vida apostólica e vida penitente'
    id: 1228
  -
    name: 'Maria Antônia de Jesus (nome secular: Maria Antônia Pereira y Andrade)'
    saint_phrase: 'Buscou o caminho da perfeição. Foi forte ao enfrentar as dificuldades e os sofrimentos'
    id: 1229
  -
    name: 'Arcângela Badosa Cuatrecasas'
    saint_phrase: 'Na vida espiritual, recebia força principalmente dos longos tempos de adoração eucarística'
    id: 1230
  -
    name: 'Maria Addolorata do Sagrado Coração (ao século: Maria Luciani)'
    saint_phrase: 'Embora possuísse uma cultura modesta, em seus escritos alcançou níveis de intensa espiritualidade, centrada na paixão de Cristo e na devoção à Addolorata'
    id: 1231
  -
    name: 'Lodovico Coccapani'
    saint_phrase: 'Conseguiu se identificar com as pessoas que sofrem. A humildade e o ocultamento foram seus traços característicos'
    id: 1232
  -
    name: 'Giovanni Pietraszko'
    saint_phrase: '«Somos homens com uma esperança mais forte que a morte, mas com a condição de que, ao mesmo tempo, sejamos homens de fé profunda e robusta»'
    id: 1233
  -
    name: 'Giuseppe Codicè'
    saint_phrase: '«Confiem, portanto, e estejam de bom ânimo, que a alegria interior nunca se afaste do seu coração, pois sabem que têm consigo o Senhor e ninguém poderá impedir que dêem frutos abundantes»'
    id: 1234
  -
    name: 'Agostino Giovanni Ukken'
    saint_phrase: 'Muitos não cristãos apreciavam e respeitavam seu trabalho apostólico, chamando-o comumente de Lord Priest'
    id: 1235
  -
    name: 'Doroteo Hernández Vera'
    saint_phrase: 'Era como uma criança nos braços de sua mãe, confiava e se entregava a Deus e à sua Providência'
    id: 1236
  -
    name: 'Melchiorre Fordon (ao século: Giuseppe)'
    saint_phrase: 'Iniciava seu serviço pastoral pela coisa mais simples: pela educação religiosa'
    id: 1237
  -
    name: 'Girolamo Maria Biasi (ao século: Arcangelo)'
    saint_phrase: 'A mensagem que nos transmite este humilde filho de São Francisco de Assis é muito semelhante à de Santa Teresa de Lisieux: a santidade é possível na aparente inatividade e a doença não é um impedimento'
    id: 1238
  -
    name: 'Michele Zavala López'
    saint_phrase: 'Para poder realizar seu trabalho na igreja, ia pedindo de porta em porta pessoalmente para obter a contribuição dos fiéis'
    id: 1239
  -
    name: 'Antonietta Giugliano'
    saint_phrase: '"Retirada e religiosa, inclinada à piedade para com Deus e ao amor pelos pobres, para os quais sentia um afeto extraordinário”'
    id: 1240
  -
    name: 'Leonarda di Gesù Crocifisso (al secolo: Angela Maria Boidi)'
    saint_phrase: '«A Comunidade é mais fundamentada no espírito de fé, mais voltada para o único necessário, mais simples diante da obediência, menos atrapalhada pelo humano, crê com maior confiança na ajuda da providência Divina».'
    id: 1241
  -
    name: 'Ambrogina de São Carlos (al secolo: Filomena D’Urso)'
    saint_phrase: '«Eu gostaria de gritar a todas as criaturas da terra: o Amor se fez Pão. Eu gostaria de gritar ao mundo que amasse o Amor. […] Quero olhar sempre para cima buscando uma única coisa: o Amor»'
    id: 1242
  -
    name: 'Carlos Tancredi Falletti Di Barolo'
    saint_phrase: 'A dolorosa descoberta de não poder ter filhos foi lida pelos cônjuges dentro do desenho providencial da insondável sabedoria de Deus, confiando-se à qual souberam viver uma paternidade e maternidade espirituais fecundíssimas'
    id: 1243
  -
    name: 'Ana Kaworek'
    saint_phrase: '«Filhas, tenham confiança porque Deus tem tempo, o seu tempo. Ele sabe o que nos dar e quando»'
    id: 1244
  -
    name: 'Maria Soledad Sanjurjo Santos (al secolo: Maria Consolata)'
    saint_phrase: 'Quantos tinham a ver com ela eram admirados de sua profunda vida espiritual, de sua prudência e clara inteligência, junto a uma grande humanidade e uma sólida humildade'
    id: 1245
  -
    name: 'Emanuele García Nieto'
    saint_phrase: 'Teve especial cuidado com os necessitados, que ajudou sempre de todas as maneiras, tanto que era chamado pelo povo de Comillas de “pai dos pobres”'
    id: 1246
  -
    name: 'József Mindszenty'
    saint_phrase: '«Quero ser um bom pastor, um pastor pronto a dar a vida por seu rebanho»'
    id: 1247
  -
    name: 'João Batista Zuaboni'
    saint_phrase: '«Nada de extraordinário ou singular, mas cumprir com singular critério, discrição, precisão, diligência, naturalidade, bom gosto cada ação, mesmo a mais pequena do dia»'
    id: 1248
  -
    name: 'Serafina Formai (al secolo: Letizia)'
    saint_phrase: 'Sempre buscou força na oração e em particular na devoção à Virgem Maria e, com profundos sentimentos de humildade, ofereceu seus sofrimentos físicos e morais como resposta de amor ao Senhor'
    id: 1249
  -
    name: 'Francisco Maria Di França'
    saint_phrase: 'Colocou em prática o que ouviu de seu Senhor e reconheceu a carne de Cristo sofredora em cada homem necessitado de ajuda moral e material, restituindo-o à sua verdadeira natureza: o ser filho de Deus'
    id: 1250
  -
    name: 'Maria Hueber'
    saint_phrase: '“Creio firmemente que sem a Vontade de Deus nada pode acontecer comigo, nem de bom, nem de doce, nem de amargo. Deus seja louvado eternamente por tudo”'
    id: 1251
  -
    name: 'Maria Teresa Camera'
    saint_phrase: 'Ensinou a atitude humilde e o serviço aos sofredores, bem como a oferta de si na paciência e no silêncio em imitação de Jesus na cruz'
    id: 1252
  -
    name: 'Maria Teresa Gabrieli'
    saint_phrase: 'Incentivava as Poverelle a serem sempre alegres mesmo nas dificuldades, a viver em paz e harmonia, compartilhando o amor do Esposo pelos mais pobres e abandonados'
    id: 1253
  -
    name: 'Giovanna Francesca dello Spirito Santo (nome secular: Luisa Ferrari)'
    saint_phrase: 'Viveu com serena disponibilidade a pobreza franciscana. Mas é a obediência a virtude que melhor descreve sua vida consagrada.'
    id: 1254
  -
    name: 'Carlo Cavina'
    saint_phrase: '“A Cruz, onde toca, fecunda”'
    id: 1255
  -
    name: 'Raffaele da Sant’Elia a Pianisi (nome secular: Domenico Petruccelli)'
    saint_phrase: 'Abrindo-se à ação da graça, soube ler com intenso olhar de fé os eventos que caracterizaram seu tempo nos pequenos centros do Meridione'
    id: 1256
  -
    name: 'Damiano da Bozzano (nome secular: Pio Giannotti)'
    saint_phrase: 'Fiel ao princípio de que tudo que não é doado se perde, respondeu ao amor de Deus e à sua misericórdia, vivendo em comunhão com todos'
    id: 1257
  -
    name: 'Vittorino Nymphas (nome secular: Agostino Arnaud Pagés)'
    saint_phrase: '«O espírito deste Instituto é, em primeiro lugar, o espírito de Fé, que deve induzir aqueles que o compõem a considerar as coisas com os olhos da fé»'
    id: 1258
  -
    name: 'Consolata Betrone (nome secular: Pierina Lorenzina Giovanna)'
    saint_phrase: 'Sua vocação particular foi a do amor'
    id: 1259
  -
    name: 'Nelson Santana'
    saint_phrase: 'Alguns dias antes havia predito que iria para o céu exatamente na noite santa de Natal: assim aconteceu'
    id: 1260
  -
    name: 'João Batista Pinardi'
    saint_phrase: '«Tu sabes o quanto eu estava longe do pensamento de ser feito bispo, mas agora posso te dizer que a cruz de bispo pesa, pesa muito!»'
    id: 1261
  -
    name: 'Carlos Salerio'
    saint_phrase: 'Sempre deu fundamental importância ao ministério da reconciliação e ao anúncio da Palavra, junto à direção espiritual de tantas almas que se confiavam'
    id: 1262
  -
    name: 'Domingo Lázaro Castro'
    saint_phrase: 'Comprometido na formação dos jovens, dedicou-se a renovar a pedagogia cristã'
    id: 1263
  -
    name: 'Salvador da Casca (no século: Erminio Pinzetta)'
    saint_phrase: 'Nunca perdeu sua serenidade, mantendo-se fiel aos votos religiosos e àquele humilde estilo de vida onde o Senhor era o centro de sua vida'
    id: 1264
  -
    name: 'Maria Eufrásia Iaconis'
    saint_phrase: '«Ânimo e avante, trabalhemos com entusiasmo pela glória de Deus e pela salvação das almas»'
    id: 1265
  -
    name: 'Agostinho Tolton'
    saint_phrase: 'Prestou atenção especial às necessidades das pessoas de cor que viviam na pobreza. Muitos fiéis brancos ficaram fascinados por sua bondade para com todos'
    id: 1266
  -
    name: 'Enzo Boschetti'
    saint_phrase: '«Se não amas a vida, não a dás, se não a dás, não podes servir o irmão, se não serves, não te libertas. Liberta-te por amor do Evangelho e dos irmãos em dificuldade»'
    id: 1267
  -
    name: 'Félix Tantardini'
    saint_phrase: '«Esforçar-me para ser feliz, sempre e a todo custo, e estar atento a fazer os outros felizes também».'
    id: 1268
  -
    name: 'João Nadiani'
    saint_phrase: '«A Adoração é um exercício angelical. Sim, certamente, por meio da Adoração nós entramos na mesma ocupação dos Anjos»'
    id: 1269
  -
    name: 'Maria Paula Muzzeddu'
    saint_phrase: '«Quando o coração ama a Deus e ao próximo, quando essa é sua verdadeira intenção e não palavras vazias, então esse coração é puro e pode ver Deus» (cf. Mt 22, 36-40)'
    id: 1270
  -
    name: 'Maria Santina Collani'
    saint_phrase: '«Estar com Jesus! Como é feio o mundo sem Ele… Tenho um único desejo: amar Jesus e me consumir por Ele… e me pergunto: “O que fiz até agora por Ele?”. Mas eu quero amá-Lo e que todos O amem».'
    id: 1271
  -
    name: 'Rosário da Visitação (nome secular: Maria Beatrice Rosario Arroyo)'
    saint_phrase: 'Espírito fervoroso de oração, fé inabalável, esperança constante, caridade generosa e desinteressada, estilo de vida pobre e alegre, atitude cordial e construtiva'
    id: 1272
  -
    name: 'Elia Hoyek'
    saint_phrase: 'Defendeu o povo libanês durante o regime otomano e a Primeira Guerra Mundial, disponibilizando também os bens do Patriarcado para aliviar o sofrimento das pessoas'
    id: 1273
  -
    name: 'João Ferro'
    saint_phrase: 'Preferiu as obras de misericórdia para todos, independentemente da ideologia política, da classe social ou da confissão religiosa'
    id: 1274
  -
    name: 'Ângelo Riesco Carbajo'
    saint_phrase: 'Amava estar entre as pessoas; era atencioso com os pobres, os enfermos e os idosos; visitava os prisioneiros; cuidava dos ciganos'
    id: 1275
  -
    name: 'Ladislao Korniłowicz'
    saint_phrase: 'Foi um convicto promotor do diálogo com os não crentes'
    id: 1276
  -
    name: 'Angelico Lipani (nome secular: Vincenzo)'
    saint_phrase: 'Buscou a vontade de Deus, enfrentando cada situação com confiança na Providência'
    id: 1277
  -
    name: 'Francesca do Espírito Santo (nome secular: Francesca de Fuentes)'
    saint_phrase: 'Enfrentou as dificuldades da vida e, em particular, a questão da excomunhão, com coragem e confiança em Deus'
    id: 1278
  -
    name: 'Stefano Pietro Morlanne'
    saint_phrase: 'Desapegado dos bens terrenos, destinou seus recursos aos necessitados, com especial atenção às mães solteiras e seus recém-nascidos'
    id: 1279
  -
    name: 'Augusto César Bertazzoni'
    saint_phrase: 'Animado por uma esperança alegre, foi forte nas dificuldades e prudente nas provas'
    id: 1280
  -
    name: 'João Luís Querbes'
    saint_phrase: '«Os homens, sem saber, são quase sempre os instrumentos da Providência»'
    id: 1281
  -
    name: 'Maria Francesca do Menino Jesus (nome de nascimento: Maria Natividad Sánchez Villoria)'
    saint_phrase: 'Muitas pessoas acorriam ao parlatorio do mosteiro para receber dela um conselho'
    id: 1282
  -
    name: 'Óvidio Charlebois'
    saint_phrase: 'Manteve sempre a serenidade mesmo diante das sofrimentos e longos períodos de solidão'
    id: 1283
  -
    name: 'Miguel Wittmann'
    saint_phrase: 'Por sua grande caridade foi chamado de “Pai dos Pobres”'
    id: 1284
  -
    name: 'Olinto Fedi'
    saint_phrase: 'Viveu os anos dramáticos da Primeira Guerra Mundial, ajudando os soldados enviados ao front e suas famílias, bem como os veteranos de guerra'
    id: 1285
  -
    name: 'Tiago Bulgaro'
    saint_phrase: 'Tanto os confrades quanto os sacerdotes diocesanos e numerosos leigos foram edificados pela sua piedade eucarística e mariana'
    id: 1286
  -
    name: 'Joana Maria Batista Solimani (nome de nascimento: Maria Antonia Felicia)'
    saint_phrase: 'Os dons místicos, testemunhados pelas irmãs, foram objeto de atenção já durante sua vida'
    id: 1287
  -
    name: 'Vicente Maria Morelli'
    saint_phrase: 'Graças à sua intensa vida espiritual, manifestou grande proximidade e atenção às necessidades de todos, “fazendo-se pequeno com os pequenos”'
    id: 1288
  -
    name: 'Carlos Ângelo Sonzini'
    saint_phrase: 'Personalidade forte e audaciosa, não deixava indiferentes aqueles que se aproximavam dele'
    id: 1289
  -
    name: 'Américo Monteiro de Aguiar'
    saint_phrase: 'Reuniu muitos voluntários, sacerdotes e leigos, para sustentar a Obra que era estruturada como uma família, gerida também pelos próprios jovens'
    id: 1290
  -
    name: 'Giulio Facibeni'
    saint_phrase: 'A caridade não era mera beneficência, mas se radicava em uma sólida fé eucarística e mariana'
    id: 1291
  -
    name: 'Gregório Tomás Suárez Fernández'
    id: 1292
  -
    name: 'Maria dos Anjos de Santa Teresa (ao seculo: Dináh Amorim)'
    saint_phrase: 'Exerceu o apostolado também nos bairros populares e nas favelas'
    id: 1293
  -
    name: 'Joaquim Masmitjá y Puig'
    saint_phrase: 'Humilde e pobre no estilo de vida, orientou toda a sua missão ao anúncio do Evangelho'
    id: 1294
  -
    name: 'José Antônio Plancarte y Labastida'
    saint_phrase: 'Com grande caridade se dedicou a responder às necessidades do seu povo'
    id: 1295
  -
    name: 'José Pio Gurruchaga Castuariense'
    saint_phrase: 'Em meio às dificuldades soube sempre conservar e ensinar a esperança'
    id: 1296
  -
    name: 'Antonio Maria da Lavaur (ao seculo: Francisco Leão Clergue)'
    saint_phrase: 'Foi apóstolo dos pobres, do cujo bem-estar material e espiritual se preocupou'
    id: 1297
  -
    name: 'Maria do Monte Carmelo da Santíssima Trindade (ao seculo: Carmen Catarina Bueno)'
    saint_phrase: 'Amou a humanidade de Cristo e aspirou continuamente a se tornar semelhante a Ele em tudo'
    id: 1298
  -
    name: 'Emílio Venturini'
    saint_phrase: 'Deixou-se guiar em tudo pela Providência, fazendo de Cristo o fundamento de toda obra'
    id: 1299
  -
    name: 'Pirro Scavizzi'
    saint_phrase: '“Ao me tornar padre não tinha nenhuma mira nem de interesse nem de honra, mas apenas de apostolado humilde, o mais humilde possível, como o único fim de fazer o bem e nada mais”'
    id: 1300
  -
    name: 'Emílio Recchia'
    saint_phrase: '“Tudo para melhorar a nossa vida e nos dedicar ao apostolado”'
    id: 1301
  -
    name: 'Mário Hiriart Pulido'
    saint_phrase: 'Promoveu, vivendo-a em primeira pessoa, a chamada universal à santidade mediante o exercício das virtudes no contexto cotidiano da vida'
    id: 1302
  -
    name: 'Francisco Caruso'
    saint_phrase: 'O confessionário foi para ele como um altar sobre o qual oferecia a si mesmo a Deus por amor àqueles que confiavam em sua orientação'
    id: 1303
  -
    name: 'Francisco Barrecheguren Montagut'
    saint_phrase: 'Cuidou do caminho de santidade da filha, ajudando-a a fazer de sua doença uma oferta de amor a Deus'
    id: 1304
  -
    name: 'Matheus Farina'
    saint_phrase: '“A coisa mais importante é que a fé não deve ser mantida dentro, mas deve ser externada aos outros; é nosso dever não obrigar a crer, mas induzir ao conhecimento de Deus”'
    id: 1305
  -
    name: 'Melchiorre Maria de Marion Brésillac'
    saint_phrase: '“Não somos livres nós missionários de não cumprir continuamente a obra de Deus. É preciso que ela nos ocupe inteiramente, que estejamos imersos nela, como identificados nela”'
    id: 1306
  -
    name: 'Glória Maria de Jesus Elizondo García (no século: Esperança)'
    saint_phrase: 'Como formadora, foi uma pioneira da renovação da vida consagrada'
    id: 1307
  -
    name: 'Eusébio Francisco Chini (conhecido como Kino)'
    saint_phrase: 'Estabeleceu ótimas relações com as populações indígenas, a ponto de os colonos o considerarem seu inimigo por ser defensor dos direitos dos nativos que considerava como seus protegidos, “nossos irmãos em Cristo”'
    id: 1308
  -
    name: 'Mariano José de Ibargüengoitia y Zuloaga'
    saint_phrase: '“O pensamento da morte era mais doce que o mel”'
    id: 1309
  -
    name: 'Maria Félix Torres'
    saint_phrase: '“É verdade que desejo apenas uma coisa com toda a minha alma: a glorificação de Deus”'
    id: 1310
  -
    name: 'Angiolino Bonetta'
    saint_phrase: 'Quando estava internado no hospital, confortava os companheiros com a palavra e a oração'
    id: 1311
  -
    name: 'Francesca da Conceição Pascual Doménech'
    saint_phrase: '“A Bondade do Senhor nos visita, com seus dons e suas graças espirituais”'
    id: 1312
  -
    name: 'Maria Dolores Segarra Gestoso'
    saint_phrase: 'O amor por Deus foi o centro e o fim de toda a sua vida: Doçura minha, o Amor é meu caminho, Presença divina, Deus adorado'
    id: 1313
  -
    name: 'Roberto Giovanni'
    saint_phrase: 'Firme no desejo de imitar Cristo, com grande fidelidade praticou até o fim uma autêntica vida cristã'
    id: 1314
  -
    name: 'Maria Teresa do Coração de Jesus (nome secular: Celia Méndez y Delgado)'
    saint_phrase: '“Considerando Deus como nosso Amor e Senhor, alegrei-me plenamente por ser sua serva, e não desejo outra coisa senão que sua santa vontade se cumpra em mim”'
    id: 1315
  -
    name: 'Fortunato Maria Farina'
    saint_phrase: '“Ofereci-me como vítima a tudo que o Senhor se agradar dispor de mim para a salvação das almas”'
    id: 1316
  -
    name: 'André Manjón y Manjón'
    saint_phrase: 'Viu a miséria, a pobreza cultural e a escassa instrução dos mais pobres da cidade e não ficou indiferente'
    id: 1317
  -
    name: 'Alfonso Ugolini'
    saint_phrase: 'Cuidou das situações de maior pobreza e marginalização no território, sem fazer distinções de pertencimento religioso ou político, com especial atenção aos imigrantes, aos nômades e aos rom'
    id: 1318
  -
    name: 'Maria Francesca Ticchi'
    saint_phrase: '“Com um amor infinito, perfeitíssimo, puríssimo, contínuo, veríssimo”'
    id: 1319
  -
    name: 'Maria Francesca Giannetto'
    saint_phrase: 'Na bolsa carregava o Evangelho para tê-lo à mão nos momentos em que sentia a necessidade de ler a Palavra de Deus'
    id: 1320
  -
    name: 'Vasco de Quiroga'
    saint_phrase: 'A sua ação, como leigo e como Bispo, teve como único objetivo o Reino de Deus'
    id: 1321
  -
    name: 'Bernardino Piccinelli'
    saint_phrase: 'O Senhor Jesus foi o único sujeito dos interesses espirituais e do apostolado sacerdotal'
    id: 1322
  -
    name: 'Antonio Vincenzo González Suárez'
    saint_phrase: 'Em cada momento buscava as coisas do alto, vivendo com a consciência de que a terra não é a morada estável'
    id: 1323
  -
    name: 'Antonio Seghezzi'
    saint_phrase: '“Coloquemo-nos de joelhos e nunca recusemos nada do que Deus dentro de nós nos pede”'
    id: 1324
  -
    name: 'Bernardo Antonini'
    saint_phrase: '“Até os confins da terra”'
    id: 1325
  -
    name: 'Ignácio Stuchlý'
    saint_phrase: 'Com a amabilidade no trato, a simplicidade de expressão e a sensibilidade às dificuldades alheias, atraía a atenção e a admiração de aqueles que encontrava'
    id: 1326
  -
    name: 'Rosa Staltari'
    saint_phrase: 'Tinha uma acentuada capacidade de intuir as necessidades e os anseios dos outros e de satisfazê-los com gestos simples, mas carregados de atenção'
    id: 1327
  -
    name: 'Michele Arcangelo Maria Antonio Vinti'
    saint_phrase: '“Como precisamos ter santos sacerdotes! Quero ser um sacerdote santo, que seja puro, humilde, pobre de espírito, desapegado de todas as coisas. Jesus e Maria, guardai-me, salvai-me, fazei-me santo sacerdote”'
    id: 1328
  -
    name: 'Ruggero Maria Caputo'
    saint_phrase: '“Tu te dás a viver comigo a minha vida eucarística no amor, na adoração, na reparação e oração. Meu pobre pequeno padre, amas-me mais do que a ti mesmo, mais do que todos os teus desejos, mais do que a tua vida? Domine, tu scis: Jesus, tu sabes que eu te amo, ou pelo menos me esforço”.'
    id: 1329
  -
    name: 'Maria Giuseppe di Gesù (ao século: Elisabetta Prout)'
    saint_phrase: 'Não buscava apenas se colocar a serviço dos pobres, mas desejava ser uma deles'
    id: 1330
  -
    name: 'Tiago Masarnau Fernández'
    saint_phrase: 'Conhecia os pobres e os chamava pelo nome, aspecto este que ia além da distribuição das anônimas esmolas'
    id: 1331
  -
    name: 'Pascoal Canzii'
    saint_phrase: 'Permanecendo por muito tempo diante da Eucaristia, se conformou cada vez mais à vontade divina'
    id: 1332
  -
    name: 'Jérôme Lejeune'
    saint_phrase: 'Sempre procurou, com zelo extraordinário, mostrar a harmonia entre a ciência e a fé'
    id: 1333
  -
    name: 'Adele Bonolis'
    saint_phrase: '“Toda alma é uma palavra de Deus não repetida”'
    id: 1334
  -
    name: 'Albino Alves da Cunha e Silva'
    saint_phrase: 'Sua ação pastoral e as obras realizadas são a expressão perfeita de seu amor a Deus e ao próximo'
    id: 1335
  -
    name: 'Ignácio de São Paulo (nome de nascimento: Jorge Spencer)'
    saint_phrase: 'Vivia a atividade pela unidade dos cristãos como um serviço ao bem da Igreja e das almas, para a maior Glória de Deus'
    id: 1336
  -
    name: 'Maria Felicita Fortunata Baseggio'
    saint_phrase: 'Sua casa se tornou um lugar de caridade e de oração'
    id: 1337
  -
    name: 'Floralba Rondi'
    saint_phrase: '«Sei em quem coloquei a minha esperança»'
    id: 1338
  -
    name: 'Clarangela Ghilardi'
    saint_phrase: 'Quis ver e servir Cristo principalmente no rosto dos pobres, dos doentes, dos encarcerados e dos órfãos'
    id: 1339
  -
    name: 'Dinarosa Belleri'
    saint_phrase: 'A caridade para com Deus a tornava capaz de descobrir o rosto de Cristo nos sofredores, de servi-los com amor, de aproximá-los dEle'
    id: 1340
  -
    name: 'Elisa Giambelluca'
    saint_phrase: '“Prometo fazer tudo para ser santa. Esta quer ser uma promessa real, porque fundamentada na confiança incondicional de que Ele pode tudo, que Maria, minha Mãe, não me deixará, que meus fundadores farão sua parte no céu”'
    id: 1341
  -
    name: 'Mercúrio Maria Teresi'
    saint_phrase: 'Generosíssimo, doava seus bens às pessoas necessitadas, mantendo para si apenas o necessário'
    id: 1342
  -
    name: 'Cosma Muñoz Pérez'
    saint_phrase: 'Sua vivência de fé o tornou capaz de reconhecer a presença de Deus nas circunstâncias ordinárias da história e de nunca vacilar diante das dificuldades'
    id: 1343
  -
    name: 'Salvador Valera Parra'
    saint_phrase: 'Viveu buscando agradar a Deus com a oração, a pobreza absoluta, a austeridade de vida, a penitência e os jejuns'
    id: 1344
  -
    name: 'Leão Veuthey (nome secular: Clodoveo)'
    saint_phrase: 'Sua caridade, antes de tudo voltada a Deus, foi sempre vivida concretamente em relação aos irmãos, acolhendo a todos com amabilidade, a qualquer hora e para qualquer necessidade'
    id: 1345
  -
    name: 'Annelvira Ossoli'
    saint_phrase: 'Buscava viver constantemente na presença de Deus, habitar Nele para levar a Ele cada encontro e cada coisa que lhe era pedida durante o dia'
    id: 1346
  -
    name: 'Vitarosa Zorza'
    saint_phrase: 'Desde criança, diante das dificuldades e grandes sofrimentos que teve que enfrentar, educou-se a confiar no Senhor e a se entregar a Ele com toda a sua essência'
    id: 1347
  -
    name: 'Danielangela Sorti'
    saint_phrase: 'Por amor a Deus, buscava transformar cada sofrimento, cada desgosto em oferta de amor e em gesto de reparação pelos pecadores'
    id: 1348
  -
    name: 'Pedro Marcellino Corradini'
    saint_phrase: 'Viveu mantendo o olhar constantemente voltado para a eternidade, confiando somente na divina misericórdia para gozar para sempre do rosto de Deus'
    id: 1349
  -
    name: 'Emanuele Stablum'
    saint_phrase: 'Unia de forma harmônica fé e profissionalismo, empenho na vida religiosa e no serviço médico, edificando os confrades, os colegas e os doentes'
    id: 1350
  -
    name: 'Henrique Ernesto Shaw'
    saint_phrase: '«Sem a caridade nada é perfeito»'
    id: 1351
  -
    name: 'Maria dos Desamparados Portilla Crespo'
    saint_phrase: 'Soube ver a mão de Deus em cada evento de sua vida'
    id: 1352
  -
    name: 'Anfrosina Berardi'
    saint_phrase: 'Toda a sua ação sempre foi voltada para o cumprimento da vontade divina'
    id: 1353
  -
    name: 'Felice Canelli'
    saint_phrase: 'Imerso na oração, passava naturalmente da atividade apostólica à intimidade com Deus'
    id: 1354
  -
    name: 'Bernardo da Mãe do Belo Amor'
    saint_phrase: '“Quero viver para as almas, especialmente para as mais pobres, as mais infelizes. Me devora até mesmo o desejo de levar ajuda, uma ajuda eficaz àqueles que mais precisam”'
    id: 1355
  -
    name: 'Mariano Gazpio Escurra'
    saint_phrase: 'Das cartas que enviava da China emerge uma infinita confiança no Senhor, especialmente nos tempos de perseguição por parte do regime comunista'
    id: 1356
  -
    name: 'Colomba de Jesus Hóstia (no século: Ana Antonietta Mezzacapo)'
    saint_phrase: '«Jesus Hóstia, meu Esposo adorado, com a minha união Contigo, quero ser um sinal no mundo»'
    id: 1357
  -
    name: 'Antônia Lesino'
    saint_phrase: 'Enquanto como enfermeira cuidava de uma ferida, costumava afirmar: "sei que estou medicando Jesus"'
    id: 1358
  -
    name: 'Alexandre Bálint'
    saint_phrase: 'Não amou apenas os familiares e amigos, mas também os rivais e os próprios perseguidores'
    id: 1359
  -
    name: 'Severino Fabriani'
    saint_phrase: '“Fez bem todas as coisas: faz ouvir os surdos e faz falar os mudos” (Mc 7, 37)'
    id: 1360
  -
    name: 'Ângela Rosa Godecka'
    saint_phrase: 'Tinha profunda confiança Nele e a Ele confiava as preocupações pelo bem da Congregação e do mundo operário'
    id: 1361
  -
    name: 'Úrsula Donati'
    saint_phrase: 'Descobriu o caminho a seguir para se entregar sem reservas ao Senhor'
    id: 1362
  -
    name: 'Maria Estela de Jesus (nome secular: Maria Aurélia Iglesias Fidalgo)'
    saint_phrase: 'Estava sempre na presença do Senhor e dEle recebia a energia para sua ação diária'
    id: 1363
  -
    name: 'Robert Schuman'
    saint_phrase: 'Sua fé nutriu e sustentou seu compromisso em trabalhar por uma Europa unida e reconciliada'
    id: 1364
  -
    name: 'Plácido Cortese (nome secular: Nicolò)'
    saint_phrase: 'Somente a caridade o guiava, convencido de que ela não deveria ter limites'
    id: 1365
  -
    name: 'Maria Cristina Cella Mocellin'
    saint_phrase: '«Foi naquela noite, no carro voltando do hospital, que você se moveu pela primeira vez. Parecia que você me dizia “obrigada mamãe por me amar!”»'
    id: 1366
  -
    name: 'Enrica Beltrame Quattrocchi'
    saint_phrase: 'O amor de Deus foi a razão de sua vida. Buscou em todas as suas atividades fazê-lo conhecido por muitos'
    id: 1367
  -
    name: 'Diego Hernández González'
    saint_phrase: '“A essência da pastoral é uma efusão de amor. A pastoral nasce de um coração de pai que, por amor, gera filhos”'
    id: 1368
  -
    name: 'Giuseppe Spoletini'
    saint_phrase: 'O amor por Deus era forte, assim como o senso de Sua glória e do bem das almas'
    id: 1369
  -
    name: 'Madalena de Jesus (nome secular: Elisabetta Maria Madalena Hutin)'
    saint_phrase: '“árabe com os árabes, nômade com os nômades”'
    id: 1370
  -
    name: 'Antônio Bello'
    saint_phrase: '“Se santo é aquele que responde ao chamado, decorre que a conduta cristã de uma pessoa ou de uma comunidade deve ser julgada em relação à santidade, não em relação a parâmetros ostensivos de sucesso, ou de organização, ou de eficiência, ou de consenso”'
    id: 1371
  -
    name: 'João de Jesus Maria (nome secular: João de San Pedro y Ustárroz)'
    saint_phrase: '"Excedeu também na virtude da caridade para com Deus e para com o próximo, na medida em que amava a Deus acima de todas as coisas e buscava a Sua glória em cada situação"'
    id: 1372
  -
    name: 'Jorge Guzzetta'
    saint_phrase: '“Do oriente e do ocidente celebrem o Senhor porque é bom, porque a sua misericórdia é para sempre”'
    id: 1373
  -
    name: 'Natalina Bonardi (nome secular: Maria)'
    saint_phrase: '"Seu recolhimento interior transparecia do exterior de modo que seus gestos, sua voz, todo o seu comportamento eram de uma pessoa sempre em diálogo com Deus"'
    id: 1374
  -
    name: 'Maria Dositea Bottani (nome secular: Maria Domênica)'
    saint_phrase: '“Ó Cristo ressuscitado, faze-nos viver esta Páscoa, que nos tornará verdadeiramente religiosas na Igreja, segundo a Igreja, pela Igreja e, ou seja, almas que Te buscam, seguindo os Teus passos; que Te amam em todos, como todos nos amaste Tu, até o extremo sacrifício de Ti mesmo”'
    id: 1375
  -
    name: 'Odette Vidal Cardoso'
    saint_phrase: '“Jesus, leva-me ao céu”'
    id: 1376
  -
    name: 'André Garrido Perales'
    saint_phrase: 'Fiel ao carisma mercedário, soube difundir entre os encarcerados o Evangelho como instrumento de libertação da prisão da marginalização social e do desprezo'
    id: 1377
  -
    name: 'Carlos Maria de Abbiategrasso'
    saint_phrase: 'Destacou-se pela extraordinária piedade, pela humildade e pela caridade, adquirindo também fama de taumaturgo'
    id: 1378
  -
    name: 'Bernardo Sartori'
    saint_phrase: 'Em oração diante do Santíssimo Sacramento, concluiu sua vida'
    id: 1379
  -
    name: 'Maria Margarida do Coração de Jesus Agonizante no Jardim do Getsêmani (nome secular: Ludovica Banaś)'
    saint_phrase: 'Amar a Deus foi seu principal compromisso'
    id: 1380
  -
    name: 'Francisco Saverio Toppi'
    saint_phrase: 'Dotado de um traço acolhedor, não pronunciava julgamentos sobre as pessoas, nem mesmo em relação àqueles que lhe causaram danos e humilhações'
    id: 1381
  -
    name: 'Gabriela Borgarino (no século: Teresa)'
    saint_phrase: '“Providência Divina do Coração de Jesus, providenciai-nos”'
    id: 1382
  -
    name: 'Maria Teresa De Vincenti (no século: Rafaela)'
    saint_phrase: 'Desejava intensamente poder anunciar a fé, com uma disponibilidade absoluta, que contava até mesmo com o martírio'
    id: 1383
  -
    name: 'Imaculado José de Jesus (no século: Aldo Brienza)'
    saint_phrase: '“Trabalhar é bom, rezar é ainda melhor, mas sofrer em união com Jesus é tudo”'
    id: 1384
  -
    name: 'Benigna Vítima de Jesus (no século: Maria Concetta Santos)'
    saint_phrase: 'Com firmeza suportou os sofrimentos, escondendo-os dos outros, através do peculiar senso de humor e da autoironia que a ajudava a se defender dos ataques'
    id: 1385
  -
    name: 'Joana Méndez Romero (dita Juanita)'
    saint_phrase: 'A fé a ajudou a enfrentar a doença que a afligiu por quarenta anos, vividos oferecendo os sofrimentos a Deus pela salvação das almas'
    id: 1386
  -
    name: 'Martinho Fulgenzio Elorza Legaristi'
    saint_phrase: 'Viveu na presença do Senhor e se dedicou à salvação das almas. Exercitou o ministério permanecendo fiel ao carisma passionista'
    id: 1387
  -
    name: 'Francisco Constantino Mazzieri'
    saint_phrase: 'Pelo amor demonstrado pelas populações africanas, foi agraciado com várias honrarias das Autoridades civis de Zambia'
    id: 1388
  -
    name: 'Lúcia Noiret (no século: Georgine)'
    saint_phrase: '«“Glorifiquemos o Divino Coração de Jesus” é o propósito da nossa amada Congregação. Que as crianças, as jovens, todos encontrem em nós uma boa irmã, a mãe piedosa, a apóstola ardente»'
    id: 1389
  -
    name: 'Casimira Gruszczyńska'
    saint_phrase: 'No último dia de sua vida, após ter recebido a Comunhão, disse: «Estou pronta»'
    id: 1390
  -
    name: 'Aurora Calvo Hernández-Agero'
    saint_phrase: 'Assídua aos sacramentos, dedicada à oração e à meditação, conseguiu estabelecer uma profunda união com Deus'
    id: 1391
  -
    name: 'Maria Aristea Ceccarelli'
    saint_phrase: 'Amou seu próximo em quem viu Jesus e foi, portanto, atenciosa em servi-lo'
    id: 1392
  -
    name: 'Rosalia Celak'
    saint_phrase: 'Durante seu caminho terreno, esteve toda imersa na vida eterna'
    id: 1393
  -
    name: 'Teofilo Bastida Camomot'
    saint_phrase: 'Sua fama de santidade já era presente durante a vida: eram conhecidos, além da grande caridade, também seus dons espirituais'
    id: 1394
  -
    name: 'Luigi Sodo'
    saint_phrase: 'A relação pessoal com o Senhor, fundamentada na oração, o levava a amar o próximo e, sobretudo, os mais necessitados'
    id: 1395
  -
    name: 'Giampietro di Sesto San Giovanni (ao século: Clemente Recalcati)'
    saint_phrase: 'Em seu apostolado privilegiou os pobres e os indígenas, como demonstra a criação de diversas obras sociais e de colégios para a educação dos indígenas'
    id: 1396
  -
    name: 'Alfredo Morganti (conhecido como Berta)'
    saint_phrase: 'Se doou com amor a Deus e ao próximo, impulsionado pela vontade de aderir ao Senhor'
    id: 1397
  -
    name: 'Marianna della Santissima Trinità (ao século: Allsopp González-Manrique)'
    saint_phrase: 'A esperança e a confiança em Deus a ajudaram a se desapegar dos vínculos terrenos, fazendo-a experimentar a pobreza de espírito'
    id: 1398
  -
    name: 'Giovanna Woynarowska'
    saint_phrase: 'Mulher de extraordinária esperança, provada pelo sofrimento. Nunca se mostrava abatida, mas irradiava paz'
    id: 1399
  -
    name: 'Jesús Antonio Gómez Gómez'
    saint_phrase: 'Passava muitas horas em adoração eucarística. Por esse motivo, as pessoas o chamavam: “A lâmpada do Santíssimo”'
    id: 1400
  -
    name: 'Umile da Genova (al secolo: Giovanni Giuseppe Bonzi)'
    saint_phrase: 'Animado por grande fé e sustentado pela constante oração, iniciou uma atividade evangélica que se tornou testemunho de caridade, especialmente entre as crianças órfãs'
    id: 1401
  -
    name: 'Giovanni Sánchez Hernández'
    saint_phrase: 'Sua vida foi caracterizada pelo anseio à santidade que buscava para si e para as almas a ele confiadas'
    id: 1402
  -
    name: 'Vittorio Coelho de Almeida'
    saint_phrase: 'As mensagens de fé, esperança e caridade eram ouvidas nos lugares mais distantes e muitas pessoas se dirigiam a ele em busca de conselhos e ajuda'
    id: 1403
  -
    name: 'Maria Celina Kannanaikal'
    saint_phrase: 'Soube manter-se sempre fiel e generosa, colocando sua vida nas mãos do Senhor'
    id: 1404
  -
    name: 'Franz de Castro Holzwarth'
    saint_phrase: '«O que importa para mim é viver minha vida em Cristo e me dar aos outros como um sacerdote. Em mim há esse desejo de doação total»'
    id: 1405
  -
    name: 'Ugo De Blasi'
    saint_phrase: 'Com humildade superava as incompreensões sabendo pedir desculpas. No exercício do ministério, mostrou grande caridade para com os necessitados de toda espécie'
    id: 1406
  -
    name: 'Aleksander Woźny'
    saint_phrase: 'Na igreja era visto frequentemente orando, todos os dias recitava a Via Crucis e era encontrado frequentemente com o terço na mão'
    id: 1407
  -
    name: 'Ignacy Posadzy'
    saint_phrase: 'Aprendeu a se relacionar com bondade, paciência e confiança, dedicando-se à conversão dos pecadores'
    id: 1408
  -
    name: 'Matteo Ricci'
    saint_phrase: '“Fazer-se chinês com os chineses”'
    id: 1409
  -
    name: 'Martin Benedict'
    saint_phrase: 'Mesmo em um clima de clandestinidade, com prudência fez do hospital um lugar de evangelização'
    id: 1410
  -
    name: 'José Marcos Figueroa'
    saint_phrase: 'Se santificou entre a portaria, que se tornou o lugar privilegiado do seu apostolado, e o Tabernáculo, onde permanecia longamente em oração'
    id: 1411
  -
    name: 'Miradio da Providência de São Caetano (nome de nascimento: Giulia Bonifacio)'
    saint_phrase: '“Você será mãe de muitos filhos que não são seus”'
    id: 1412
  -
    name: 'Maria Ignazia Isacchi (nome de nascimento: Angela Caterina)'
    saint_phrase: 'A devoção ao Sagrado Coração de Jesus representou um dos pilares de sua vivência interior'
    id: 1413
  -
    name: 'Margherita Crispi (nome de nascimento: Diomira Ludovica Romana)'
    saint_phrase: 'Confiante no amor do Senhor, nutria uma grande esperança na misericórdia de Deus'
    id: 1414
  -
    name: 'Margherita Maria Guaini (nome de nascimento: Alice Antonia)'
    saint_phrase: 'Foi uma mulher de intensa oração, permeada, sobretudo, pelo desejo de viver longos períodos de adoração silenciosa diante da Eucaristia'
    id: 1415
  -
    name: 'Magdalena Aulina Saurina'
    saint_phrase: '“nas dificuldades olhem para Jesus na Cruz e meditem sua paixão ... Façam tudo, então, por amor, para agradar a Jesus”'
    id: 1416
  -
    name: 'Teresa Veronesi'
    saint_phrase: 'Sua caridade e coragem brilharam quando salvou a vida de um partigiano e quando ousou protestar diante de episódios dramáticos, como a fuzilação de três partigianos'
    id: 1417
  -
    name: 'Luisa Guidotti Mistrali'
    saint_phrase: 'Serviu ao Senhor em terras africanas, dedicando-se por completo aos necessitados e expondo-se a graves riscos, culminando depois com a morte'
    id: 1418
  -
    name: 'Miguel Costa y Llobera'
    saint_phrase: 'Buscou amar o Senhor com toda a sua força, permanecendo imerso no diálogo com Ele'
    id: 1419
  -
    name: 'Gaetano Francesco Mauro'
    saint_phrase: 'Nas provas, nutria uma profunda esperança, rastreável na confiança na misericórdia divina'
    id: 1420
  -
    name: 'João Barra'
    saint_phrase: '“Se olho para o passado, sinto em mim uma onda de alegria e gratidão subindo do coração. Sou verdadeiramente um padre feliz com meu sacerdócio”'
    id: 1421
  -
    name: 'Vicente López de Uralde Lazcano'
    saint_phrase: 'Ele se doou aos outros com discrição e humildade, respondendo prontamente às necessidades do próximo'
    id: 1422
  -
